# Serves the built SPA inside the frontend image.
#
# WHY THIS FILE EXISTS
# -----------------------------------------------------------------------------
# The frontend used to run `npm run dev` — the Vite development server — behind a
# public hostname. Vite refuses any Host it does not recognise, so every new
# hostname returned `403 Blocked request` until it was added to
# VITE_ALLOWED_HOSTS. A static bundle has no host check, no HMR socket and no
# dev server, so that entire class of problem disappears.
#
# WHY PORT 5173
# -----------------------------------------------------------------------------
# It is the port the dev server used. Keeping it means the reverse proxy's
# `upstream jkannel_frontend { server frontend:5173; }` and the compose port
# mapping need no change — the swap from dev server to static build is invisible
# to everything outside this image.
#
# nginx-unprivileged runs as a non-root user, so it may only bind above 1024.
# 5173 satisfies that; a port below 1024 here would fail to start.

server {
    listen       5173;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No server_tokens: the version number is free reconnaissance.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Vite fingerprints these filenames, so the content at a given URL can never
    # change. Caching them for a year is safe and removes almost all repeat
    # traffic.
    location /assets/ {
        try_files $uri =404;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached. It is the file that names the current
    # asset hashes, so a stale copy pins the browser to a deleted bundle and the
    # app fails to load after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: any unknown path is a Vue route, not a 404. Without
    # this, refreshing on /services or deep-linking a message trace returns
    # nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness for the container healthcheck. Cheap, and does not depend on the
    # bundle being present.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
