<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JKANNEL telecommunications operations platform" />
    <!--
      Served from frontend/public, so it resolves at the site root under both the
      dev server and a built bundle. The `any` sizes hint keeps browsers from
      rasterising the SVG at one fixed size. `mask-icon` covers Safari pinned
      tabs, which ignores the SVG icon above and wants a monochrome silhouette.
    -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#7367f0" />
    <meta name="theme-color" content="#7367f0" />
    <title>JKANNEL — Kamex control plane</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
