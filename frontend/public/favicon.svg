<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JKANNEL">
  <!--
    Matches the console's brand mark: the `sms` glyph from AppIcon.vue on the
    brand rounded square used by .brand-mark. Kept as a single flat shape so it
    stays legible at 16px, where gradients and thin strokes turn to mud.

    #1a86c8 is --blue-500, the DocFlow Blue accent adopted house-wide; it is
    written literally because an SVG served from /public cannot read a CSS
    custom property. Keep it in step with --brand in style.css. It reads on
    both light and dark browser chrome, so no prefers-color-scheme variant is
    needed.
  -->
  <rect width="32" height="32" rx="8" fill="#1a86c8" />
  <path
    d="M8.5 9h15a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-9.2L10 24v-4H8.5A1.5 1.5 0 0 1 7 18.5v-8A1.5 1.5 0 0 1 8.5 9z"
    fill="#ffffff"
  />
</svg>
