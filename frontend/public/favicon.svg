  <path
    d="M8.5 9h15a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-9.2L10 24v-4H8.5A1.5 1.5 0 0 1 7 18.5v-8A1.5 1.5 0 0 1 8.5 9z"
    fill="#ffffff"
  />
</svg>
