<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="JKANNEL">
  <!--
    Matches the console's brand mark: the `sms` glyph from AppIcon.vue on the
    brand-violet rounded square used by .brand-mark. Kept as a single flat shape
    so it stays legible at 16px, where gradients and thin strokes turn to mud.
    Brand violet reads on both light and dark browser chrome, so no
    prefers-color-scheme variant is needed.
  -->
