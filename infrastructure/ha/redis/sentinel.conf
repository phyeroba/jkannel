# ---------------------------------------------------------------------------
# Redis Sentinel configuration template (HA profile).
#
# Mounted read-only into each sentinel container; the entrypoint copies it to a
# writable path (/data/sentinel.conf) at startup because Sentinel REWRITES its
# own config file at runtime (it records the discovered master/replicas there).
#
# Topology: one master (redis-primary) + one replica (redis-replica), watched by
# three sentinels with a quorum of 2. A quorum of 2-of-3 tolerates the loss of a
# single sentinel while still being able to authorize a failover.
# ---------------------------------------------------------------------------
port 26379

# In Docker we address peers by service name, not IP. resolve/announce-hostnames
# (Redis 6.2+) make Sentinel store and gossip hostnames so failover survives the
# fact that container IPs are not stable across recreation.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor the master 'mymaster' at redis-primary:6379; 2 sentinels must agree the
# master is down (objectively) before a failover is authorized.
sentinel monitor mymaster redis-primary 6379 2

# Consider the master down after 5s of unreachability.
sentinel down-after-milliseconds mymaster 5000

# Reconfigure at most 1 replica at a time against the new master after failover.
sentinel parallel-syncs mymaster 1

# Abort + retry a failover that does not complete within 10s.
sentinel failover-timeout mymaster 10000
