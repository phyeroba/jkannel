# JKANNEL HA reverse proxy — load-balances the SPA + REST API across MULTIPLE
# stateless backend replicas. This is the Wave-4 nginx config adapted for the HA
# profile: the only functional difference from infrastructure/nginx/conf.d/
# jkannel.conf is that the backend upstream lists two servers.
#
# Mounted into a SEPARATE reverse-proxy-ha container (published on
# ${PROXY_HA_HTTP_PORT}, default 8090) so it never collides with the live
# single-node reverse-proxy on 8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Round-robin across the primary backend and the HA replica. keepalive pools
# connections; max_fails/fail_timeout eject an unhealthy replica so a rolling
# restart of one node does not fail client requests (they route to the other).
upstream jkannel_backend {
    server backend:3000          max_fails=3 fail_timeout=10s;
    server backend-replica:3000  max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream jkannel_frontend {
    server frontend:5173;
    keepalive 32;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Retry the next upstream when a replica is draining/restarting mid-request.
    proxy_next_upstream error timeout http_502 http_503 http_504;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://jkannel_backend;
    }

    location / {
        proxy_pass http://jkannel_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
