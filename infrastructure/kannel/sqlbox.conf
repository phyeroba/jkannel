# SQLBox is the durable message ingress/event boundary between bearerbox and smsbox.
# NOTE: the connection group must precede the sqlbox group — sqlbox's backend
# discovery panics if it reaches the sqlbox group before a matching
# *-connection group has been parsed (known upstream sqlbox behavior).
group = pgsql-connection
id = jkannel-sqlbox
host = postgres
port = 5432
username = ${POSTGRES_USER}
password = ${POSTGRES_PASSWORD}
database = ${POSTGRES_DB}
max-connections = 10

group = sqlbox
id = jkannel-sqlbox
smsbox-id = jkannel-sqlbox
bearerbox-host = kamex-bearerbox
bearerbox-port = 13001
smsbox-port = 13005
smsbox-port-ssl = false
sql-log-table = sent_sms
sql-insert-table = send_sms
log-file = "/var/log/kamex/sqlbox.log"
log-level = 1
