# Local validation configuration. Production configuration is generated by JKANNEL.
group = core
admin-port = 13000
admin-password = ${KAMEX_ADMIN_PASSWORD}
status-password = ${KAMEX_STATUS_PASSWORD}
smsbox-port = 13001
log-level = 1
log-format = json

group = smsc
smsc = fake
smsc-id = local-fake
port = 10000

# A second local bind. Two binds are required to exercise the Live Queue
# console's on-the-fly rerouting (moving a queued message from one bind to
# another), so the default validation topology ships with a reroute target.
group = smsc
smsc = fake
smsc-id = local-fake-b
port = 10001

# INERT IN THIS FILE. bearerbox never reads the smsbox or sms-service groups —
# they belong to the smsbox process, which is configured by
# infrastructure/kannel/kamex-smsbox.conf. They are kept here only so this
# template stays a complete, parseable example. Change inbound behaviour THERE,
# not here; editing these lines has no effect on anything.
#
# Note the value below differs from the smsbox config on purpose: a real smsbox
# must point at kamex-sqlbox (SQLBox proxies to bearerbox and writes the message
# history), whereas this inert group documents the no-SQLBox topology.
group = smsbox
bearerbox-host = kamex-bearerbox
sendsms-port = 13013
log-level = 1
log-format = json

group = sendsms-user
username = jkannel
password = ${KAMEX_SENDSMS_PASSWORD}

# max-messages = 0 suppresses the canned auto-reply (gw/smsbox.c:322). Without
# it Kannel answers every inbound message with this text as a billable MT.
group = sms-service
keyword = default
text = "No service specified"
max-messages = 0

