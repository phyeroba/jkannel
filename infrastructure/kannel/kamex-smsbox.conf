# smsbox connects to SQLBox, which in turn connects to bearerbox on port 13001.
group = core
admin-port = 13000
smsbox-port = 13005
admin-password = ${KAMEX_ADMIN_PASSWORD}
status-password = ${KAMEX_STATUS_PASSWORD}
log-file = "/var/log/kamex/smsbox.log"
log-level = 1
log-format = json

group = smsbox
bearerbox-host = kamex-sqlbox
sendsms-port = 13013
log-file = "/var/log/kamex/smsbox.log"
log-level = 1
# Retry a callback that fails transiently rather than dropping the inbound
# message. Only meaningful once post-url below is enabled; harmless before that.
http-request-retry = 3
http-timeout = 20

group = sendsms-user
username = jkannel
password = ${KAMEX_SENDSMS_PASSWORD}
concatenation = true
max-messages = 10

# ---------------------------------------------------------------------------
# INBOUND (MO)
#
# This group did not exist before, and its absence was not harmless. With no
# sms-service group at all, urltrans_find() returns NULL for every inbound
# message (gw/smsbox.c:1846), smsbox falls through to reply_requestfailed
# (gw/smsbox.c:1909), and because trans == NULL sets max_msgs = 1
# (gw/smsbox.c:318-321) the reply is actually SENT. Every subscriber who texted
# this gateway received "Request Failed" as a real, billable MT.
#
# `max-messages = 0` is the documented kill switch: gw/smsbox.c:322 returns
# early with "No reply sent, denied." The `text` below is therefore never
# transmitted — it exists to give urltrans_find something to match so the
# request-failed path is not reached at all.
#
# Every directive in this file was checked against gwlib/cfg.def in the pinned
# Kamex 1.8.3 source. That matters more than usual here: cfg.c rejects any
# variable it does not know and fails the WHOLE config load, so one bad line
# stops the box rather than being ignored.
group = sms-service
keyword = default
text = "No service specified"
max-messages = 0

# MO PUSH — ready to enable, deliberately not enabled.
#
# Uncommenting this makes Kannel POST every inbound message to JKANNEL, which
# is lower-latency than the engine sweep that ingests MO today. It is left off
# because the endpoint cannot currently accept the request:
#
#   1. AUTH. mo.controller.ts guards the route with AuthGuard, which requires
#      `Authorization: Bearer <JWT>`. Kannel's only credential mechanism is URL
#      userinfo, which emits `Authorization: Basic ...`. Kannel cannot mint a
#      JWT, and sms-service has no header-injection directive (verified against
#      cfg.def), so there is no way to send a bearer token.
#   2. PAYLOAD SHAPE. post-url sends the message text as a text/plain BODY with
#      the metadata in the query string and X-Kannel-* headers. The handler
#      reads @Body() only, and no text/plain parser is registered, so req.body
#      is {} and validation rejects it as a missing sender.
#
# Enabling this before both are fixed would fail on every inbound message.
# The escape codes below were read out of gw/urltrans.c, not documentation:
# %p is the ORIGINAL SENDER (smsbox swaps sender/receiver before calling the
# service, because it is building a reply), %P the original receiver, %b the
# URL-encoded body (%a would rejoin words with '+' and lose spacing), %i the
# smsc-id, %I the engine's message UUID, %T a unix timestamp (%t has no zone
# marker and would be misread as local time).
#
# post-url = "http://jkannel-backend:3000/api/v1/mo/inbound?sender=%p&receiver=%P&text=%b&smscId=%i&externalRef=%I&receivedAt=%T"
# catch-all = true
# accept-x-kannel-headers = true
# send-sender = true
# omit-empty = true
