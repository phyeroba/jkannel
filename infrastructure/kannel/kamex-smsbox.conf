# smsbox connects to SQLBox, which in turn connects to bearerbox on port 13001.
group = core
admin-port = 13000
smsbox-port = 13005
admin-password = ${KAMEX_ADMIN_PASSWORD}
status-password = ${KAMEX_STATUS_PASSWORD}
log-file = "/var/log/kamex/smsbox.log"
log-level = 1
log-format = json

group = smsbox
bearerbox-host = kamex-sqlbox
sendsms-port = 13013
log-file = "/var/log/kamex/smsbox.log"
log-level = 1

group = sendsms-user
username = jkannel
password = ${KAMEX_SENDSMS_PASSWORD}
concatenation = true
max-messages = 10
