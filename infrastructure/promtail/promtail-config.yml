# JKANNEL Promtail — discovers containers via the Docker socket and ships their
# stdout/stderr logs to Loki. Started only under the "observability" profile.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

# Persisted to a named volume so restarts do not re-ingest old log lines.
positions:
  filename: /data/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Only scrape containers from this compose project.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'jkannel'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - target_label: 'job'
        replacement: 'docker'
