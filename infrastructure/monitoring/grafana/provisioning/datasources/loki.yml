apiVersion: 1

# Loki datasource for centralized logs. Loki only runs under the
# "observability" profile; when it is down this datasource simply shows as
# unreachable in Grafana and can be ignored.
datasources:
  - name: JKANNEL Loki
    uid: jkannel-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
