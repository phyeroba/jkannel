# The HTTPS entrypoint. Routing is identical to the HTTP-only topology in
# ../conf.d/jkannel.conf; the differences are the TLS listener, HSTS, and the
# fact that X-Forwarded-Proto is now genuinely 'https' from the edge.

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Certificate + key. The FILE NAMES are fixed; the DIRECTORY is whatever the
    # operator mounts at /etc/nginx/certs (TLS_CERT_DIR in .env), so the real
    # material can live outside the repo — /etc/letsencrypt/live/<domain>, a
    # secrets tmpfs, a Docker secret mount, anything.
    #
    #   jkannel.crt  full chain: leaf first, then intermediates (NOT the root)
    #   jkannel.key  private key, mode 0600, owned readable by uid 101
    #
    # Let's Encrypt equivalents: fullchain.pem -> jkannel.crt, privkey.pem -> jkannel.key.
    ssl_certificate     /etc/nginx/certs/jkannel.crt;
    ssl_certificate_key /etc/nginx/certs/jkannel.key;

    # Allow bulk config / CSV imports through the proxy.
    client_max_body_size 25m;

    # --- Security headers -------------------------------------------------
    # HSTS. Read this before deploying: once a browser sees it, that host is
    # HTTPS-only for a year and a broken certificate becomes an un-clickable
    # error page. Start with a short max-age (e.g. 300) while you validate the
    # certificate chain, then raise it. `includeSubDomains` commits every
    # subdomain of this host too. `preload` is deliberately NOT set — that is
    # effectively irreversible and must be an explicit operator decision.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Shared proxy behaviour -------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Liveness endpoint (also served on the HTTP listener for the healthcheck).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API -> backend. The /api prefix is preserved because proxy_pass has
    # no path component; the backend serves /api/v1/*.
    location /api/ {
        proxy_pass http://jkannel_backend;
    }

    # Everything else -> frontend (Vite dev server, including the HMR socket).
    # NOTE: defining any proxy_set_header in a location cancels inheritance of
    # the server-level ones, so the shared forwarding headers MUST be repeated
    # here. Without Host, nginx would send the upstream name as the Host, which
    # the Vite dev server's host-check rejects with 403.
    location / {
        proxy_pass http://jkannel_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
