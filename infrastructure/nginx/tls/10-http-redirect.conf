# Plain-HTTP listener whose only jobs are to redirect to HTTPS, answer the
# container healthcheck, and serve ACME http-01 challenges.
#
# nginx-unprivileged runs as uid 101 and cannot bind :80, so this is :8080
# inside the container. Publish it on the host as 80 (see docker-compose.yml,
# service `reverse-proxy-tls`) so that `http://host/...` reaches it.

server {
    listen 8080;
    server_name _;

    # The healthcheck must NOT be redirected: it runs inside the container over
    # plain HTTP, and following a 301 to a self-signed :8443 would fail.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME http-01 (certbot / lego / acme.sh webroot mode). This is the concrete
    # path to a real, auto-renewing certificate: point the client's --webroot-path
    # at infrastructure/nginx/acme on the host, and it writes the challenge token
    # here while the redirect below leaves this prefix alone.
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/acme;
        default_type text/plain;
        access_log off;
    }

    # Everything else: permanent redirect, preserving host and path. 301 (not
    # 302) so browsers and intermediaries cache it.
    location / {
        return 301 https://$host$request_uri;
    }
}
