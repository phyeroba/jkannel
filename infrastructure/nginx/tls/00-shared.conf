# JKANNEL reverse proxy — shared http{} context for the TLS topology.
#
# This directory is an ALTERNATIVE to ../conf.d, mounted at /etc/nginx/conf.d in
# the profile-gated `reverse-proxy-tls` service. The two are never loaded
# together: `reverse-proxy` (HTTP only, TLS terminated upstream) keeps using
# ../conf.d and is completely untouched by anything here.
#
# Files are included alphabetically, so this one defines everything the server
# blocks below depend on.

# Websocket upgrade plumbing (used by the Vite dev-server HMR channel).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jkannel_backend {
    server backend:3000;
    keepalive 32;
}

upstream jkannel_frontend {
    server frontend:5173;
    keepalive 32;
}

# gzip for text assets and JSON API responses.
#
# Note: gzip over TLS is the BREACH precondition. It is left on because the API
# does not reflect attacker-controlled input alongside a secret in the same
# response body, and the session token is an Authorization bearer rather than a
# cookie the browser attaches automatically. Set `gzip off;` here if your threat
# model disagrees.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

# ---------------------------------------------------------------------------
# TLS parameters (Mozilla "intermediate", Feb 2025 generation).
# ---------------------------------------------------------------------------
# TLS 1.2 is kept for compatibility with older carrier/enterprise clients; 1.0
# and 1.1 are not offered at all. On TLS 1.3 the cipher list is ignored (nginx
# uses the 1.3 suites), so this list only governs 1.2.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
# Mozilla intermediate: let the CLIENT choose, because modern clients order by
# their own hardware (AES-NI vs ChaCha20) better than a fixed server list can.
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_cache shared:JKANNEL_TLS:10m;
ssl_session_timeout 1d;
# Tickets off: without key rotation they undermine forward secrecy.
ssl_session_tickets off;

# OCSP stapling needs a certificate chain that includes the issuer and a
# resolver to reach the OCSP responder. It is OFF by default because a
# self-signed dev certificate has no responder and would only log errors.
# With a real CA-issued chain in jkannel.crt, uncomment all three:
#   ssl_stapling on;
#   ssl_stapling_verify on;
#   resolver 127.0.0.11 valid=60s ipv6=off;   # Docker's embedded DNS
