# JKANNEL reverse proxy — single HTTP entrypoint in front of the SPA + REST API.
#
# Runs inside nginxinc/nginx-unprivileged, whose master + workers run as the
# non-root uid 101. It therefore listens on the unprivileged port 8080 inside
# the container, which compose publishes to the host as ${PROXY_HTTP_PORT}.
#
# This file is mounted into /etc/nginx/conf.d/ and is included from the base
# image's http{} context, so upstream/map/gzip directives are valid here.

# Websocket upgrade plumbing (used by the Vite dev-server HMR channel).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jkannel_backend {
    server backend:3000;
    keepalive 32;
}

upstream jkannel_frontend {
    server frontend:5173;
    keepalive 32;
}

# gzip for text assets and JSON API responses.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

server {
    listen 8080;
    server_name _;

    # Allow bulk config / CSV imports through the proxy.
    client_max_body_size 25m;

    # --- Security headers (dev-safe defaults; tighten CSP before prod) ---
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Shared proxy behaviour ---
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Liveness endpoint for the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # REST API -> backend. The /api prefix is preserved because proxy_pass has
    # no path component; the backend serves /api/v1/*.
    location /api/ {
        proxy_pass http://jkannel_backend;
    }

    # Everything else -> frontend (Vite dev server, including the HMR socket).
    # NOTE: defining any proxy_set_header in a location cancels inheritance of the
    # server-level proxy_set_header directives, so the shared forwarding headers
    # (Host in particular) MUST be repeated here. Without Host, nginx would send
    # the upstream name ("jkannel_frontend") as the Host, which the Vite dev
    # server's host-check rejects with 403. Forwarding the real $host (127.0.0.1)
    # keeps Vite happy in dev; a production build serves static assets and has no
    # host-check. If fronted by a real domain in dev, add it to Vite's
    # server.allowedHosts.
    location / {
        proxy_pass http://jkannel_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # The /api location likewise re-declares Host so the backend sees the external
    # host rather than the upstream name (harmless for the API, kept consistent).
    # (Handled inline above; see location /api/.)
}
