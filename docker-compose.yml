name: jkannel

# ---------------------------------------------------------------------------
# Networks (service isolation per DOCKER_DEPLOYMENT spec §6).
#   edge   — public entrypoint: reverse-proxy <-> frontend/backend only.
#   appnet — application plane: backend <-> engine (kamex) services.
#   datanet— data plane: backend/workers <-> postgres, redis (NOT reachable
#            from the edge/proxy network, so the database is never exposed to
#            the public entrypoint).
#   obsnet — observability plane: prometheus/grafana/loki/promtail, plus the
#            scrape targets (backend, kamex-bearerbox).
# ---------------------------------------------------------------------------
networks:
  edge:
    driver: bridge
  appnet:
    driver: bridge
  datanet:
    driver: bridge
  obsnet:
    driver: bridge

# ---------------------------------------------------------------------------
# Resource governance
# ---------------------------------------------------------------------------
# This stack is designed to be CO-HOSTED: it shares its host with unrelated
# workloads. Before this block, no service had any limit at all, so one runaway
# container (a pg_dump of a large database, an SMPP flood, a leaking Node heap)
# could take the whole host — including the co-tenant — down with it.
#
# WHICH KEYS. These are the deploy-AGNOSTIC keys (`mem_limit`, `mem_reservation`,
# `cpus`, `pids_limit`, `ulimits`), which `docker compose up` applies directly to
# the container. The swarm-style `deploy.resources.*` block is IGNORED by
# `docker compose up` unless you also pass --compatibility, so it is deliberately
# not used here. Verify with `docker compose --env-file .env.example config`:
# the keys survive into the rendered model.
#
# THE BUDGET (host: ~10 GB RAM, shared with another stack).
#
#   Default profile (what `docker compose up -d` starts):
#     postgres 1536m + backend 1024m + frontend 768m + redis 512m
#     + reverse-proxy 128m + kamex-validator 128m           = 4096m ceiling
#     reservations (the soft floor the scheduler keeps free) =  1088m
#
#   Optional profiles, each additive:
#     engine-kamex   bearerbox 512m + smsbox 256m + sqlbox 256m  = 1024m
#     workers        scheduler 512m + backup-service 1024m       = 1536m
#     monitoring     prometheus 768m + grafana 512m              = 1280m
#     observability  loki 512m + promtail 256m                   =  768m
#     watchdog       64m
#     tls            reverse-proxy-tls 128m
#
# So the default stack cannot exceed ~4 GB, leaving ~6 GB for the co-tenant and
# the host. Enabling engine-kamex + workers takes it to ~6.7 GB, which is the
# realistic production shape; adding monitoring AND observability on top would
# reach ~8.7 GB and is NOT advisable on this host — run those elsewhere or trim
# their limits. Limits are ceilings, not allocations: idle containers use far
# less. They are set generously on purpose — a limit that OOM-kills the backend
# mid-backup is worse than no limit at all.
#
# WHY THESE NUMBERS.
#   postgres 1536m — shared_buffers plus per-connection work_mem; the single
#     largest legitimate consumer, and the one whose OOM is most damaging.
#   backend / backup-service 1024m — BackupDrService reads the whole pg_dump
#     into a Buffer and encrypts it, so peak RSS is ~2x the dump size plus the
#     Node baseline. This is the headroom for that, not for steady state.
#   frontend 768m — a Vite dev server with esbuild/rollup in watch mode.
#   redis 512m — no maxmemory is configured, so this cap is the real backstop.
#   nginx 128m — worker processes plus a 10m TLS session cache.
#
# pids_limit caps fork-bomb blast radius (postgres forks a backend per
# connection; the Kamex boxes are thread-based). ulimits.nofile is raised
# because Docker's 1024 default is too low for a socket-heavy gateway, but is
# bounded rather than unlimited.
# ---------------------------------------------------------------------------
x-ulimits-high: &ulimits-high
  nofile:
    soft: 65536
    hard: 65536
x-ulimits-standard: &ulimits-standard
  nofile:
    soft: 16384
    hard: 16384
x-ulimits-minimal: &ulimits-minimal
  nofile:
    soft: 4096
    hard: 4096

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    networks:
      - datanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Hardening: no privilege escalation. read_only/cap_drop are intentionally
    # NOT applied — the official postgres entrypoint chowns its data dir and
    # manages its own unprivileged 'postgres' user at runtime; forcing them
    # risks breaking the live database. See infrastructure/README.md.
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    mem_reservation: 512m
    cpus: 1.5
    pids_limit: 512
    ulimits: *ulimits-high
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - datanet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Hardening: no privilege escalation. read_only left off because the redis
    # entrypoint chowns /data and drops privileges via gosu on start.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: jkannel-backend:local
    environment: &backend-env
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_APP_URL: postgresql://jkannel_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_DATABASE_URL: postgresql://jkannel_auth:${POSTGRES_AUTH_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      MIGRATIONS_ON_BOOT: ${MIGRATIONS_ON_BOOT:-true}
      MIGRATIONS_DIR: /app/database/migrations
      REDIS_URL: redis://redis:6379
      AUTH_ACCESS_TOKEN_KEY: ${AUTH_ACCESS_TOKEN_KEY:-}
      AUTH_REFRESH_TOKEN_KEY: ${AUTH_REFRESH_TOKEN_KEY:-}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      AI_OPERATIONS_ENABLED: ${AI_OPERATIONS_ENABLED:-false}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-jkannel@localhost}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_COPILOT_MODEL: ${AI_COPILOT_MODEL:-claude-sonnet-5}
      # Scheduled daily/weekly volume-report generation + anomaly detection.
      REPORT_JOBS_ENABLED: ${REPORT_JOBS_ENABLED:-true}
      REPORT_JOBS_INTERVAL_MS: ${REPORT_JOBS_INTERVAL_MS:-900000}
      # Backup & DR: real pg_dump artifacts, encryption, scheduler.
      BACKUP_DIR: /var/lib/jkannel/backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_SCHEDULER_ENABLED: ${BACKUP_SCHEDULER_ENABLED:-true}
      BACKUP_SCHEDULER_INTERVAL_MS: ${BACKUP_SCHEDULER_INTERVAL_MS:-3600000}
      # MFA secret encryption (falls back to an auth key when unset).
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      KAMEX_BASE_URL: http://kamex-bearerbox:13000
      KAMEX_STATUS_PASSWORD: ${KAMEX_STATUS_PASSWORD}
      KAMEX_ADMIN_PASSWORD: ${KAMEX_ADMIN_PASSWORD}
      KAMEX_CONFIG_PATH: /var/lib/jkannel/kamex.conf
      KAMEX_VALIDATOR_URL: http://kamex-validator:8080
      KAMEX_VALIDATOR_TOKEN: ${KAMEX_VALIDATOR_TOKEN}
      KAMEX_SQLBOX_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./runtime/kamex:/var/lib/jkannel
      - ./database/migrations:/app/database/migrations:ro
    networks:
      - edge
      - appnet
      - datanet
      - obsnet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kamex-validator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Hardening: no privilege escalation. read_only left off — the app writes
    # encrypted backup artifacts into /var/lib/jkannel (a bind mount).
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 1.5
    pids_limit: 512
    ulimits: *ulimits-high
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Use 127.0.0.1 (IPv4) rather than localhost: on Windows/macOS the browser
      # resolves localhost to IPv6 ::1 first, but Docker publishes ports on IPv4,
      # so API calls to http://localhost:3000 fail with "Failed to fetch".
      #
      # To route the SPA through the reverse proxy instead of the direct backend
      # port, set VITE_API_BASE_URL=http://localhost:${PROXY_HTTP_PORT}/api and
      # add that origin to FRONTEND_ORIGIN (see .env.example).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${BACKEND_PORT:-3000}/api}
      # Hostnames the Vite dev server will serve. Behind a reverse proxy it
      # receives the PUBLIC hostname and returns 403 unless that name is listed
      # here (localhost/127.0.0.1 are always allowed). Comma-separated; a leading
      # dot allows a whole suffix.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 512
    ulimits: *ulimits-standard
    restart: unless-stopped

  # --- Reverse proxy: single HTTP entrypoint in front of frontend + backend ---
  # nginx-unprivileged runs entirely as the non-root uid 101 and listens on 8080
  # inside the container.
  #
  # THIS SERVICE IS HTTP-ONLY BY DESIGN. It is the "TLS terminated upstream"
  # topology: a system nginx (or any other edge) in front of it holds the
  # certificate and proxies cleartext to ${PROXY_HTTP_PORT}. To have JKANNEL
  # terminate TLS itself instead, use the profile-gated `reverse-proxy-tls`
  # service below and leave this one exactly as it is. Both topologies are
  # documented in infrastructure/nginx/README.md.
  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    ports:
      # HTTP only. Do NOT add an HTTPS mapping here — a live deployment relies
      # on this exact port list (see the note above `reverse-proxy-tls`).
      - "${PROXY_HTTP_PORT:-8080}:8080"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Hardening: fully non-root, read-only rootfs with tmpfs for the paths nginx
    # must write, all Linux capabilities dropped.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  # --- Reverse proxy, TLS-terminating variant (profile: tls) -----------------
  # The "TLS terminated by JKANNEL" topology: this container holds the
  # certificate, serves HTTPS on 8443, and 301-redirects plain HTTP to it.
  #
  # It is a SEPARATE, PROFILE-GATED service rather than extra ports on
  # `reverse-proxy` on purpose:
  #   * `reverse-proxy` is running in production right now behind an upstream
  #     TLS terminator. Changing its `ports:` could republish a port publicly or
  #     collide with a co-hosted stack, so its port list is left untouched.
  #   * Nothing here starts unless you explicitly opt in with `--profile tls`,
  #     so today's deployment is bit-for-bit unaffected.
  #
  #   docker compose --profile tls up -d reverse-proxy-tls
  #
  # PORTS. Defaults bind to 127.0.0.1 so that merely enabling the profile can
  # never expose a new public listener by accident. To actually serve the
  # internet, set PROXY_TLS_BIND_ADDRESS=0.0.0.0 (and expect to run the HTTP
  # redirect on 80 and HTTPS on 443). Certificates: see
  # infrastructure/nginx/README.md.
  reverse-proxy-tls:
    profiles: ["tls"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      # A DIFFERENT config directory from `reverse-proxy` — the two never share
      # a server block, so neither can affect the other.
      - ./infrastructure/nginx/tls:/etc/nginx/conf.d:ro
      # Certificate directory. Override TLS_CERT_DIR to mount real material from
      # outside the repo, e.g. /etc/letsencrypt/live/jkannel.example.com.
      - ${TLS_CERT_DIR:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
      # ACME http-01 webroot, for certbot/lego/acme.sh in --webroot mode.
      - ./infrastructure/nginx/acme:/etc/nginx/acme:ro
    ports:
      - "${PROXY_TLS_BIND_ADDRESS:-127.0.0.1}:${PROXY_TLS_HTTP_PORT:-8081}:8080"
      - "${PROXY_TLS_BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTPS_PORT:-8443}:8443"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # Plain HTTP on purpose: /healthz is exempt from the HTTPS redirect, so
      # this works with a self-signed certificate the healthcheck cannot verify.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  kamex-bearerbox:
    profiles: ["engine-kamex"]
    image: ghcr.io/vaska94/kamex:1.8.3@sha256:c13f0e390bf0cbadef55440a6dc584670851faf41e42a027644e984502a21d7d
    command: ["/etc/kamex/kamex.conf"]
    # Kamex expands ${VAR} from its OWN environment when it parses the config, so
    # every placeholder a generated config references must be present HERE, not
    # just in the backend. An unset variable expands to an empty string, which for
    # an smsc-password means the bind fails authentication with no obvious cause.
    # `POST /configurations/generate` returns `requiredSecrets` listing exactly the
    # variables the rendered file needs — add each one to this block (and to .env)
    # before deploying a carrier configuration.
    environment:
      KAMEX_ADMIN_PASSWORD: ${KAMEX_ADMIN_PASSWORD}
      KAMEX_STATUS_PASSWORD: ${KAMEX_STATUS_PASSWORD}
      # Referenced by the sendsms-user group in the shipped config.
      KAMEX_SENDSMS_PASSWORD: ${KAMEX_SENDSMS_PASSWORD}
      # Carrier bind credential for a generated SMPP smsc group. The name must
      # match the secret:// reference on the SMSC record — secret://kamex/foo
      # renders as ${KAMEX_FOO}. Empty by default so the stack starts without one.
      KAMEX_CARRIER_PASSWORD: ${KAMEX_CARRIER_PASSWORD:-}
    volumes:
      - ./runtime/kamex/kamex.conf:/etc/kamex/kamex.conf:ro
      - kamex-spool:/var/spool/kamex
      - kamex-logs:/var/log/kamex
    ports:
      - "${KAMEX_ADMIN_PORT:-13000}:13000"
    networks:
      - appnet
      - obsnet
    # Liveness via the UNAUTHENTICATED /health endpoint. This used to call
    # /status.json?password=..., six authenticated requests a minute, forever.
    # Kamex answers a failed authentication by adding a second to a
    # process-global sleep counter and sleeping the single thread that serves
    # /health, /status, /shutdown AND /graceful-restart — so with a wrong
    # status password this probe alone degraded the admin port until bearerbox
    # was restarted, taking JKANNEL's monitoring and config-deploy path with it.
    # A liveness probe must not be able to cause the outage it reports.
    #
    # 200 OR 503 both count as alive: 503 is bearerbox's answer when it is
    # running but no SMSC is bound. That is a carrier problem, surfaced by
    # JKANNEL's own alerting — not a reason to call the container unhealthy and
    # have an orchestrator restart it, which would drop every remaining bind.
    healthcheck:
      test: ["CMD-SHELL", "s=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/health); [ \"$$s\" = 200 ] || [ \"$$s\" = 503 ]"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Hardening: no privilege escalation. The upstream kamex image writes spool
    # and logs and is not designed for a read-only rootfs / dropped caps, so
    # those are intentionally left off (documented in infrastructure/README.md).
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 512
    ulimits: *ulimits-high
    restart: unless-stopped

  kamex-validator:
    build:
      context: ./infrastructure/kannel/validator
    environment:
      VALIDATOR_TOKEN: ${KAMEX_VALIDATOR_TOKEN}
      KAMEX_ADMIN_PASSWORD: ${KAMEX_ADMIN_PASSWORD}
      KAMEX_STATUS_PASSWORD: ${KAMEX_STATUS_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 128
    ulimits: *ulimits-standard
    restart: unless-stopped

  kamex-smsbox:
    profiles: ["engine-kamex"]
    image: ghcr.io/vaska94/kamex:1.8.3@sha256:c13f0e390bf0cbadef55440a6dc584670851faf41e42a027644e984502a21d7d
    entrypoint: ["/usr/sbin/smsbox"]
    command: ["/etc/kamex/kamex-smsbox.conf"]
    environment:
      KAMEX_ADMIN_PASSWORD: ${KAMEX_ADMIN_PASSWORD}
      KAMEX_STATUS_PASSWORD: ${KAMEX_STATUS_PASSWORD}
      KAMEX_SENDSMS_PASSWORD: ${KAMEX_SENDSMS_PASSWORD}
    volumes:
      - ./infrastructure/kannel/kamex-smsbox.conf:/etc/kamex/kamex-smsbox.conf:ro
      - kamex-logs:/var/log/kamex
    ports:
      - "${KAMEX_SENDSMS_PORT:-13013}:13013"
    networks:
      - appnet
    depends_on:
      kamex-sqlbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS --max-time 3 http://127.0.0.1:13013/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  kamex-sqlbox:
    profiles: ["engine-kamex"]
    build:
      context: ./infrastructure/kannel/sqlbox
    command: ["/etc/kamex/sqlbox.conf"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/kannel/sqlbox.conf:/etc/kamex/sqlbox.conf:ro
      - kamex-logs:/var/log/kamex
    networks:
      - appnet
      - datanet
    depends_on:
      postgres:
        condition: service_healthy
      kamex-bearerbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  # --- Optional split-out workers (profile: workers) ------------------------
  # The report and backup schedulers currently run IN-PROCESS inside the
  # backend by default. These services reuse the backend image to run the same
  # schedulers as dedicated containers. The backup scheduler is safe to run in
  # parallel with the backend (it holds a PostgreSQL advisory lock, so only one
  # replica executes a cycle). The report scheduler only has an in-process
  # guard, so to avoid duplicate report generation set REPORT_JOBS_ENABLED=false
  # on the backend when you enable the 'scheduler' worker (see .env.example).
  scheduler:
    profiles: ["workers"]
    image: jkannel-backend:local
    build:
      context: ./backend
    environment:
      <<: *backend-env
      MIGRATIONS_ON_BOOT: "false"
      REPORT_JOBS_ENABLED: "true"
      BACKUP_SCHEDULER_ENABLED: "false"
    volumes:
      - ./runtime/kamex:/var/lib/jkannel
      - ./database/migrations:/app/database/migrations:ro
    networks:
      - appnet
      - datanet
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 512
    ulimits: *ulimits-high
    restart: unless-stopped

  backup-service:
    profiles: ["workers"]
    image: jkannel-backend:local
    build:
      context: ./backend
    environment:
      <<: *backend-env
      MIGRATIONS_ON_BOOT: "false"
      REPORT_JOBS_ENABLED: "false"
      BACKUP_SCHEDULER_ENABLED: "true"
    volumes:
      - ./runtime/kamex:/var/lib/jkannel
      - ./database/migrations:/app/database/migrations:ro
    networks:
      - appnet
      - datanet
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    # The most memory-hungry service in the stack for its size: it shells out to
    # pg_dump AND buffers the whole dump in the Node heap to encrypt it, so peak
    # RSS is roughly twice the logical dump size. Sized for that peak.
    mem_limit: 1024m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 512
    ulimits: *ulimits-high
    restart: unless-stopped

  # --- Watchdog: restarts containers stuck in an unhealthy state ------------
  watchdog:
    profiles: ["watchdog"]
    image: docker:27-cli
    entrypoint: ["/bin/sh", "/opt/watchdog/watchdog.sh"]
    environment:
      HOME: /tmp
      WATCHDOG_PROJECT: jkannel
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infrastructure/watchdog/watchdog.sh:/opt/watchdog/watchdog.sh:ro
    networks:
      - edge
    # Hardening: read-only rootfs, tmpfs for HOME, all caps dropped. It only
    # talks to the Docker socket (as its root owner), which does not require any
    # Linux capability inside the container.
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.25
    pids_limit: 128
    ulimits: *ulimits-minimal
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - obsnet
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 15d of TSDB retention: the head block plus query working set.
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - obsnet
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  # --- Centralized logging (profile: observability) ------------------------
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    user: "10001:10001"
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - obsnet
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.75
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/data
    networks:
      - obsnet
    depends_on:
      - loki
    # Hardening: read-only rootfs, all caps dropped, no privilege escalation.
    # Runs as root (default) because it reads the Docker socket for service
    # discovery; as the socket's owner it needs no extra capability.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 256
    ulimits: *ulimits-standard
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kamex-spool:
  kamex-logs:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:
