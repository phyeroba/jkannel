          <Dialog
            open={summary}
            title="Diagnostic summary"
            onClose={() => setSummary(false)}
            footer={<button className="secondary-button" onClick={() => setSummary(false)}>Copy</button>}
          >
            <pre className="mono" style={{ margin: 0, padding: 14, background: 'var(--surface-2)', border: '1px solid var(--border)', borderRadius: 10, fontSize: 12.5, lineHeight: 1.7, overflow: 'auto', color: 'var(--text-strong)', whiteSpace: 'pre-wrap' }}>
{'Session ' + session.id + ' (' + session.smsc + ', ' + session.carrier + ')\n' +
 'Endpoint: ' + session.endpoint + '\n' +
 'Window: last ' + range + ' (gateway time EAT)\n' +
 'Bind state: ' + session.bind + ' · uptime ' + session.uptime + '\n' +
 'Reconnects: ' + session.reconnects + ' · enquire_link timeouts: ' + session.timeouts + ' · missed: ' + session.enquireMissed + '\n' +
 'submit_sm ' + session.submit.toLocaleString() + ' / resp ' + session.submitResp.toLocaleString() + ' · generic_nack ' + session.nack + '\n' +
 'Response latency P95: ' + session.latencyP95 + '\n' +
 'Dominant command status: ' + session.topError + '\n' +
 'Sibling sessions on the same SMSC: ' + siblings.filter((s) => s.id !== session.id).map((s) => s.id + ' (' + s.health + ', ' + s.reconnects + ' reconnects)').join(', ')}
            </pre>

    </>
  );
}

/* Section 6 and UC-TRF-01. The table updates values in place and does not
   reorder rows on refresh unless ranking is switched on — a live table that
   reshuffles under the cursor is unusable in a NOC. */
function TrafficScreen({ onNavigate, range }) {
  const [carrier, setCarrier] = React.useState('any');
  const [rank, setRank] = React.useState(false);
  const [paused, setPaused] = React.useState(false);

  const rows = SMSCS.filter((s) => carrier === 'any' || s.carrier === carrier);
  const shown = rank ? [...rows].sort((a, b) => b.tpsOut - a.tpsOut) : rows;
  const mt = MT_SERIES[MT_SERIES.length - 1];
  const peak = Math.max(...MT_SERIES);
  const avg = Math.round(MT_SERIES.reduce((a, b) => a + b, 0) / MT_SERIES.length);
  const capacity = 850;

  return (
    <>
      <section className="metrics-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))' }}>
        <MetricCard label="MT now" value={mt + '/s'} detail={'avg ' + avg + ' · peak ' + peak} icon="chart" />
        <MetricCard label="MO now" value={MO_SERIES[MO_SERIES.length - 1] + '/s'} detail="inbound from carriers" icon="sms" />
        <MetricCard label="DLR now" value={DLR_SERIES[DLR_SERIES.length - 1] + '/s'} detail="receipts arriving" icon="check" />
        <MetricCard label="Utilisation" value={Math.round((mt / capacity) * 100) + '%'} detail={'of ' + capacity + '/s known capacity'} icon="server" tone={mt / capacity > 0.8 ? 'warn' : 'primary'} />
      </section>

      <Panel
        title="Throughput"
        subtitle={'MT, MO and DLR over the last ' + range + ' — the shaded expectation is derived from the same weekday last week'}
        action={
          <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <FilterSelect label="Carrier" value={carrier} onChange={(e) => setCarrier(e.target.value)}>
              {['any', ...new Set(SMSCS.map((s) => s.carrier))].map((c) => <option key={c}>{c}</option>)}
            </FilterSelect>
            <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => setPaused(!paused)}>
              {paused ? 'Resume live' : 'Pause live'}
            </button>
          </span>
        }
        style={{ marginBottom: 16 }}
      >
        <div style={{ marginTop: 16 }}>
          <MiniChart
            series={[{ name: 'MT submitted', values: MT_SERIES }, { name: 'DLR received', values: DLR_SERIES }, { name: 'MO received', values: MO_SERIES }]}
            labels={CLOCK_LABELS}
            height={200}
          />
        </div>
        <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 12 }}>
          {paused
            ? 'Live refresh paused, so you can read and copy values. The chart is frozen at 01:41:12.'
            : 'Values update in place every 5 seconds. Row order is held steady while live.'}
        </p>
      </Panel>

      <Panel
        title="Traffic matrix"
        subtitle="Throughput beside queue and delivery quality, so a healthy rate with a growing queue is visible"
        action={
          <label className="filter-select">
            <span>Rank by TPS</span>
            <select value={rank ? 'on' : 'off'} onChange={(e) => setRank(e.target.value === 'on')}>
              <option value="off">off</option>
              <option value="on">on</option>
            </select>
          </label>
        }
      >
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SMSC</th><th>Carrier</th><th>State</th>
                <th style={{ textAlign: 'right' }}>MT out</th><th style={{ textAlign: 'right' }}>MO in</th>
                <th style={{ textAlign: 'right' }}>Utilisation</th><th style={{ textAlign: 'right' }}>Queue</th>
                <th style={{ textAlign: 'right' }}>Oldest</th><th style={{ textAlign: 'right' }}>Delivery</th>
              </tr>
            </thead>
            <tbody>
              {shown.map((s) => (
                <tr key={s.id} className="selectable" onClick={() => onNavigate('/smscs')}>
                  <td className="mono">{s.id}</td>
                  <td>{s.carrier}</td>
                  <td><StatusBadge tone={healthTone(s.state)}>{s.state}</StatusBadge></td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.tpsOut}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.tpsIn}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{Math.round((s.tpsOut / s.capacity) * 100)}%</td>
                  <td className="figures" style={{ textAlign: 'right', color: s.queue > 500 ? 'var(--warn)' : undefined }}>{s.queue.toLocaleString()}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.queueAge}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.delivery === null ? 'unknown' : s.delivery + '%'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 14 }}>
          UTL shows 0 out with 412 queued — throughput alone would have looked like low demand.
        </p>
      </Panel>
    </>
  );
}

/* Section 7 and UC-QUE-01. Drain estimate is only shown when egress is stable;
   with zero egress it reads "unavailable", never infinity. The cause line names
   which of the four possibilities applies. */
function QueuesScreen({ onNavigate }) {
  const [selectedId, setSelectedId] = React.useState('q-mtn-trx1');
  const queue = QUEUES.find((q) => q.id === selectedId);
  const smsc = SMSCS.find((s) => s.id === queue.destination);

  const cause = smsc.state === 'disconnected'
    ? { label: 'Carrier outage', detail: 'The destination SMSC is disconnected, so nothing is leaving. This is not capacity restriction or an operator decision.', tone: 'bad' }
    : smsc.suspended
      ? { label: 'Intentional suspension', detail: 'An operator suspended this connection. The queue is growing by design until traffic resumes.', tone: 'warn' }
      : queue.growth > 0
        ? { label: 'Capacity restriction', detail: 'Egress is below ingress while the carrier is throttling. The bind is up and delivering, just not fast enough.', tone: 'warn' }
        : { label: 'Draining normally', detail: 'Egress meets or exceeds ingress. No action needed.', tone: 'good' };

  const recovery = [
    { at: '01:41:44', label: 'reconnect issued', detail: 'operator cycled the bind, reason recorded', state: 'info' },
    { at: '01:42:02', label: 'egress resumed', detail: '188 → 212 msg/s', state: 'ok' },
    { at: '01:42:30', label: 'growth stopped', detail: 'net rate crossed below zero', state: 'ok' },
    { at: '01:51:00', label: 'projected empty', detail: 'if egress holds at 212 msg/s', state: 'info' },
  ];

  return (
    <>
      <Panel title="Queues" subtitle="Depth, age and growth per destination — select one to see cause and recovery" style={{ marginBottom: 16 }}>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Queue</th><th>Destination</th><th>Route</th>
                <th style={{ textAlign: 'right' }}>Depth</th><th style={{ textAlign: 'right' }}>Oldest</th>
                <th style={{ textAlign: 'right' }}>Ingress</th><th style={{ textAlign: 'right' }}>Egress</th>
                <th style={{ textAlign: 'right' }}>Growth</th><th style={{ textAlign: 'right' }}>Retries</th>
                <th style={{ textAlign: 'right' }}>Expired</th><th style={{ textAlign: 'right' }}>Drain</th>
              </tr>
            </thead>
            <tbody>
              {QUEUES.map((q) => (
                <tr key={q.id} className={q.id === selectedId ? 'selectable selected' : 'selectable'} onClick={() => setSelectedId(q.id)}>
                  <td className="mono">{q.id}</td>
                  <td className="mono">{q.destination}<span className="row-id">{q.carrier}</span></td>
                  <td>{q.route}</td>
                  <td className="figures" style={{ textAlign: 'right', color: q.depth > 500 ? 'var(--warn)' : undefined }}>{q.depth.toLocaleString()}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{q.oldest}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{q.ingress}/s</td>
                  <td className="figures" style={{ textAlign: 'right', color: q.egress === 0 ? 'var(--bad)' : undefined }}>{q.egress}/s</td>
                  <td className="figures" style={{ textAlign: 'right', color: q.growth > 0 ? 'var(--bad)' : q.growth < 0 ? 'var(--good)' : undefined }}>
                    {q.growth > 0 ? '+' : ''}{q.growth}/s
                  </td>
                  <td className="figures" style={{ textAlign: 'right' }}>{q.retries.toLocaleString()}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{q.expired}</td>
                  <td className="mono" style={{ textAlign: 'right', color: q.drainReliable ? undefined : 'var(--muted)' }}>{q.drainReliable ? q.drain : 'unavailable'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>

      <section className="split-grid">
        <Panel
          title={queue.id}
          subtitle={'Destination ' + queue.destination + ' · route ' + queue.route}
          action={
            <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

/* UC-RTE-02. The dialog compares current and proposed target health, capacity and
   queue implications; an unhealthy or under-capacity target is blocked rather than
   quietly allowed. Manual override state stays visible afterwards. */
const REASONS = [
  'Carrier instructed traffic movement',
  'Primary SMSC degraded',
  'Planned carrier maintenance',
  'Capacity rebalance',
  'Incident mitigation',
];

function FailoverScreen({ onNavigate }) {
  const [selectedId, setSelectedId] = React.useState('r-mtn');
  const [target, setTarget] = React.useState('');
  const [pending, setPending] = React.useState(null);
  const [applied, setApplied] = React.useState({});
  const [result, setResult] = React.useState('');

  const route = ROUTES.find((r) => r.id === selectedId);
  const active = applied[route.id] || route.active;
  const options = [route.primary, route.secondary, route.emergency].filter((t) => t && t !== '—' && t !== active);
  const proposed = SMSCS.find((s) => s.id === (target || options[0]));
  const current = SMSCS.find((s) => s.id === active);
  const headroom = proposed ? proposed.capacity - proposed.tpsOut : 0;
  const blocked = proposed ? (proposed.state === 'disconnected' || proposed.state === 'suspended') : true;
  const tight = proposed ? headroom < route.tps : false;

  const commit = (reason) => {
    setApplied({ ...applied, [route.id]: proposed.id });
    setResult('Route “' + route.name + '” now active on ' + proposed.id + '. Mode set to manual override — reason recorded: ' + reason + '. Watching traffic transfer, error rate and queue for 5 minutes.');
    setPending(null);
  };

  return (
    <>
      {result ? <p className="notice" style={{ marginBottom: 14 }}>{result}</p> : null}

      <Panel title="Failover" subtitle="Move a route's traffic to another carrier connection, with the impact stated before you commit" style={{ marginBottom: 16 }}>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Route</th><th>Active target</th><th>Mode</th><th style={{ textAlign: 'right' }}>TPS</th><th style={{ textAlign: 'right' }}>Queue</th><th>Alternatives available</th></tr></thead>
            <tbody>
              {ROUTES.map((r) => {
                const act = applied[r.id] || r.active;
                const alts = [r.primary, r.secondary, r.emergency].filter((t) => t && t !== '—' && t !== act);
                return (
                  <tr key={r.id} className={r.id === selectedId ? 'selectable selected' : 'selectable'} onClick={() => { setSelectedId(r.id); setTarget(''); }}>
                    <td><strong style={{ color: 'var(--text-strong)' }}>{r.name}</strong></td>
                    <td>{act === 'none' ? <StatusBadge tone="bad">none</StatusBadge> : <span className="mono">{act}</span>}</td>
                    <td>{applied[r.id] || r.mode === 'manual' ? <StatusBadge tone="warn">manual</StatusBadge> : 'automatic'}</td>
                    <td className="figures" style={{ textAlign: 'right' }}>{r.tps}</td>
                    <td className="figures" style={{ textAlign: 'right' }}>{r.queue.toLocaleString()}</td>
                    <td>{alts.length ? <span className="mono" style={{ fontSize: 12.5 }}>{alts.join(', ')}</span> : <span style={{ color: 'var(--muted)' }}>none configured</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Panel>

      <section className="split-grid">
        <Panel
          title={'Fail over — ' + route.name}
          subtitle={options.length ? 'Compare the current and proposed path before committing' : 'No alternate target is configured for this route'}
          action={options.length ? (
            <button className="primary-button" style={{ padding: '6px 12px', fontSize: 13 }} disabled={blocked} onClick={() => setPending(true)}>
              Fail over
            </button>
          ) : null}
        >
          {options.length ? (
            <>
              <label className="field" style={{ margin: '16px 0 0' }}>
                <span>Proposed target</span>
                <select value={target || options[0]} onChange={(e) => setTarget(e.target.value)}>
                  {options.map((o) => <option key={o}>{o}</option>)}
                </select>
              </label>

              <div className="table-wrap" style={{ marginTop: 16 }}>
                <table>
                  <thead><tr><th>Path</th><th>SMSC</th><th>Health</th><th style={{ textAlign: 'right' }}>Used / capacity</th><th style={{ textAlign: 'right' }}>Headroom</th><th style={{ textAlign: 'right' }}>Queue</th></tr></thead>
                  <tbody>
                    <tr>
                      <td>Current</td>
                      <td className="mono">{active === 'none' ? '—' : active}</td>
                      <td>{current ? <StatusBadge tone={healthTone(current.state)}>{current.state}</StatusBadge> : <StatusBadge tone="bad">none</StatusBadge>}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{current ? current.tpsOut + ' / ' + current.capacity : '—'}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{current ? current.capacity - current.tpsOut : '—'}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{current ? current.queue.toLocaleString() : '—'}</td>
                    </tr>
                    <tr style={{ background: 'var(--brand-soft)' }}>
                      <td>Proposed</td>
                      <td className="mono">{proposed.id}</td>
                      <td><StatusBadge tone={healthTone(proposed.state)}>{proposed.state}</StatusBadge></td>
                      <td className="figures" style={{ textAlign: 'right' }}>{proposed.tpsOut} / {proposed.capacity}</td>
                      <td className="figures" style={{ textAlign: 'right', color: tight ? 'var(--warn)' : undefined }}>{headroom}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{proposed.queue.toLocaleString()}</td>
                    </tr>
                  </tbody>
                </table>
              </div>

              {blocked ? (
                <p className="notice" style={{ margin: '14px 0 0', color: 'var(--bad)', borderColor: 'color-mix(in srgb, var(--bad) 32%, var(--border))', background: 'color-mix(in srgb, var(--bad) 10%, var(--surface))' }}>
                  Blocked: {proposed.id} is {proposed.state}. Failing over to it would stop this route's traffic
                  entirely rather than restore it.
                </p>
              ) : tight ? (
                <p className="notice" style={{ margin: '14px 0 0', color: 'var(--warn)', borderColor: 'color-mix(in srgb, var(--warn) 32%, var(--border))', background: 'color-mix(in srgb, var(--warn) 10%, var(--surface))' }}>
                  {proposed.id} has {headroom} msg/s of headroom but this route carries {route.tps} msg/s.
                  Expect throttling or queue growth on the new target.
                </p>
              ) : null}
            </>
          ) : (
            <p className="chart-empty">
              Configure a secondary target for this route before an incident forces the question.
            </p>
          )}
        </Panel>

        <Panel title="Transition history" subtitle="Every failover, automatic or manual, with its reason">
          <div style={{ marginTop: 16 }}>
            <Timeline items={[
              { at: '01:19:58', label: 'automatic failover attempted', detail: 'UTL national — no alternate target configured, traffic queued instead', state: 'error' },
              { at: '00:58:40', label: 'manual override', detail: 'Smart national held on smart_ug_tx — operator, carrier instructed traffic movement', state: 'warn' },
              { at: '2026-08-14 22:14:02', label: 'automatic failover', detail: 'Airtel national moved to airtel_ug_trx2 during carrier maintenance', state: 'info' },
              { at: '2026-08-14 22:18:44', label: 'automatic return', detail: 'primary rebound and healthy for 4 minutes, traffic returned', state: 'ok' },
            ]} />
          </div>
          <button className="text-button" style={{ marginTop: 12 }} onClick={() => onNavigate('/audit')}>Open Audit Trail</button>
        </Panel>
      </section>

      <ConfirmAction
        open={Boolean(pending)}
        title={'Fail over ' + route.name + ' to ' + (proposed ? proposed.id : '')}
        verb="Fail over"
        reasons={REASONS}
        warning={tight ? 'The proposed target has less headroom than this route currently carries. Traffic may throttle on arrival.' : null}
        impact={proposed ? [
          ['Route', route.name],
          ['Current target', active === 'none' ? 'none — traffic is queueing' : active + ' (' + (current ? current.state : 'unknown') + ')'],
          ['Proposed target', proposed.id + ' (' + proposed.state + ')'],
          ['Traffic to move', route.tps + ' msg/s'],
          ['Headroom on proposed', headroom + ' msg/s'],
          ['Queue implication', route.queue.toLocaleString() + ' already queued on the current path — these do not move'],
          ['Mode after', 'manual override until an operator returns it to automatic'],
        ] : []}
        onClose={() => setPending(null)}
        onConfirm={commit}
      />
    </>
  );
}

/* UC-RTE-01. Explicitly non-transmitting: it resolves the number, names the
   market and network, evaluates the live rules and explains why the route
   matched — without sending anything. */
function SimulatorScreen({ onNavigate }) {
  const [input, setInput] = React.useState('0772 000 118');
  const [attrs, setAttrs] = React.useState('none');
  const [result, setResult] = React.useState(null);

  const resolve = () => {
    const digits = input.replace(/[^0-9]/g, '');
    const e164 = digits.startsWith('256') ? digits : digits.startsWith('0') ? '256' + digits.slice(1) : digits;
    const match = PREFIX_MAP.find((p) => e164.startsWith(p.prefix));
    if (!match) {
      setResult({ e164: '+' + e164, none: true });
      return;
    }
    const route = ROUTES.find((r) => r.name === match.route);
    const target = SMSCS.find((s) => s.id === route.active);
    const fallbacks = [route.secondary, route.emergency].filter((t) => t && t !== '—');
    setResult({ e164: '+' + e164, prefix: match.prefix, carrier: match.carrier, route, target, fallbacks });
  };

  return (
    <section className="split-grid wide-right">
      <Panel title="Route simulator" subtitle="Resolves a destination against the live rules. Nothing is transmitted and no counter moves.">
        <p className="notice" style={{ margin: '14px 0 0' }}>
          Non-transmitting. This tool answers “where would this go?” — it never sends a message. To send a
          real test, use Test Tools.
        </p>
        <div style={{ display: 'grid', gap: 14, marginTop: 16 }}>
          <label className="field" style={{ margin: 0 }}>
            <span>Destination MSISDN</span>
            <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="0772 000 118 or +256772000118" />
          </label>
          <label className="field" style={{ margin: 0 }}>
            <span>Technical attributes (optional)</span>
            <select value={attrs} onChange={(e) => setAttrs(e.target.value)}>

            </select>
          </label>
          <div><button className="primary-button" onClick={resolve}>Resolve route</button></div>
        </div>
      </Panel>

      <Panel title="Decision" subtitle="Which SMSC this destination would take right now, and why">

            <div style={{ marginTop: 16 }}>

              <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 10 }}>
                {result.e164} normalised successfully but matches no configured prefix, so routing would fail

              </p>
            </div>
          ) : (
            <div style={{ display: 'grid', gap: 16, marginTop: 16 }}>
              <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(150px, auto) minmax(0, 1fr)', gap: '6px 16px', margin: 0, padding: 12, borderRadius: 10, background: 'var(--surface-2)' }}>
                {[
                  ['Normalised', result.e164],
                  ['Market / network', 'Uganda · ' + result.carrier],
                  ['Matched prefix', result.prefix],
                  ['Route', result.route.name],
                  ['Selected SMSC', result.route.active === 'none' ? 'none available' : result.route.active],
                  ['Mode', result.route.mode],
                ].map(([label, value]) => (
                  <React.Fragment key={label}>
                    <dt style={{ color: 'var(--muted)', fontSize: 13 }}>{label}</dt>
                    <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
                  </React.Fragment>
                ))}
              </dl>

              <div>
                <div className="t-caps" style={{ marginBottom: 8 }}>Fallback order</div>
                {result.fallbacks.length ? (
                  <div className="table-wrap" style={{ margin: 0 }}>
                    <table>
                      <thead><tr><th>Order</th><th>SMSC</th><th>Health</th><th style={{ textAlign: 'right' }}>Headroom</th></tr></thead>
                      <tbody>
                        {result.fallbacks.map((id, i) => {
                          const s = SMSCS.find((x) => x.id === id);
                          return (
                            <tr key={id}>
                              <td className="figures">{i + 1}</td>
                              <td className="mono">{id}</td>
                              <td>{s ? <StatusBadge tone={healthTone(s.state)}>{s.state}</StatusBadge> : <StatusBadge tone="muted">unknown</StatusBadge>}</td>
                              <td className="figures" style={{ textAlign: 'right' }}>{s ? (s.capacity - s.tpsOut) + ' msg/s' : '—'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <p style={{ color: 'var(--muted)', fontSize: 13.5, margin: 0 }}>
                    None configured — if the selected SMSC is unavailable this traffic queues.
                  </p>
                )}
              </div>

              <div>
                <div className="t-caps" style={{ marginBottom: 6 }}>Why</div>
                <ol style={{ margin: 0, paddingLeft: 20, color: 'var(--muted)', fontSize: 13.5, lineHeight: 1.7 }}>
                  <li>Number normalised to E.164 and resolved to {result.carrier} by prefix {result.prefix}.</li>
                  <li>Route “{result.route.name}” is the only rule matching that prefix.</li>
                  <li>
                    {result.target
                      ? 'Primary target ' + result.target.id + ' is ' + result.target.state + ', so it keeps the traffic.'
                      : 'No target is currently available, so traffic for this route queues.'}
                  </li>
                  {result.route.mode === 'manual' ? <li>A manual override is in force on this route — automatic selection is suspended.</li> : null}
                </ol>
              </div>

              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => onNavigate('/routes')}>Open route</button>
                <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => onNavigate('/tools')}>Send a real test</button>
              </div>
            </div>
          )
        ) : (
          <p className="chart-empty">Enter a destination and resolve it to see the matched route, selected SMSC and fallback order.</p>
        )}
      </Panel>
    </section>
  );
}

/* ---- ui_kits/console/TraceScreen.jsx ---- */
/* Section 10 and UC-MSG-01. The lifecycle is a chronological trace, not a log
   dump: each stage carries its timestamp and the latency since the previous one,
   and the first abnormal or missing stage is called out. */
const GENERIC_STAGES = [
  { at: '—', stage: 'ingress', detail: 'accepted from submit API', latency: '—', state: 'ok' },
  { at: '—', stage: 'route decision', detail: 'route matched', latency: '—', state: 'ok' },
  { at: '—', stage: 'queue', detail: 'awaiting egress', latency: '—', state: 'warn' },
  { at: '—', stage: 'submit_sm', detail: 'not yet sent — destination SMSC is disconnected', latency: '—', state: 'missing' },
  { at: '—', stage: 'DLR', detail: 'not expected until the message is submitted', latency: '—', state: 'missing' },
];

function TraceScreen({ onNavigate }) {
  const [query, setQuery] = React.useState('');
  const [status, setStatus] = React.useState('any');
  const [selected, setSelected] = React.useState(null);
  const [notFound, setNotFound] = React.useState(false);
  const [summary, setSummary] = React.useState(false);

  const rows = TRACE_MESSAGES.filter((m) =>
    (status === 'any' || m.status === status) &&
    (!query.trim() || m.id.includes(query.trim()) || m.msisdn.includes(query.replace(/[^0-9+]/g, '')) || m.carrierId.includes(query.trim()))
  );

  const stages = selected
    ? (TRACE_STAGES[selected.id] || GENERIC_STAGES).map((s) => ({ at: s.at, label: s.stage, detail: s.detail, latency: s.latency === '—' ? null : s.latency, state: s.state }))
    : [];
  const firstBad = stages.find((s) => s.state === 'error' || s.state === 'missing');

  return (
    <>
      <Panel
        title="Message trace"
        subtitle="Search by Kamex message ID, carrier message ID or MSISDN"
        action={
          <FilterSelect label="Status" value={status} onChange={(e) => setStatus(e.target.value)}>
            {['any', 'delivered', 'failed', 'pending', 'queued'].map((s) => <option key={s}>{s}</option>)}
          </FilterSelect>
        }
        style={{ marginBottom: 16 }}
      >
        <div className="grid-toolbar" style={{ marginTop: 14 }}>
          <label className="filter-search" style={{ flex: '1 1 260px' }}>
            <input value={query} onChange={(e) => { setQuery(e.target.value); setNotFound(false); }} placeholder="kmx_01HXQ4K2R9, 448210-mtn or +256772000118" />
          </label>
          <button className="primary-button" style={{ padding: '6px 12px', fontSize: 13 }} onClick={() => setNotFound(rows.length === 0)}>Search</button>
        </div>

        {notFound && !rows.length ? (
          <p className="notice" style={{ margin: '0 0 14px', color: 'var(--warn)', borderColor: 'color-mix(in srgb, var(--warn) 32%, var(--border))', background: 'color-mix(in srgb, var(--warn) 10%, var(--surface))' }}>
            No message matches that identifier in the retained window. This is “not found”, which is different
            from retention-expired — messages older than 90 days are pruned and would report differently.
          </p>
        ) : null}

        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Message ID</th><th>Carrier ID</th><th>Destination</th><th>Sender</th><th>Carrier</th><th>SMSC</th><th>Route</th><th>Status</th><th style={{ textAlign: 'right' }}>Submitted</th><th style={{ textAlign: 'right' }}>Final</th></tr>
            </thead>
            <tbody>
              {rows.length ? rows.map((m) => (
                <tr key={m.id} className="selectable" onClick={() => setSelected(m)}>
                  <td className="mono">{m.id}</td>
                  <td className="mono" style={{ fontSize: 12.5 }}>{m.carrierId}</td>
                  <td className="mono">{m.msisdn}</td>
                  <td>{m.sender}</td>
                  <td>{m.carrier}</td>
                  <td className="mono" style={{ fontSize: 12.5 }}>{m.smsc}</td>
                  <td>{m.route}</td>
                  <td><StatusBadge tone={m.status === 'delivered' ? 'good' : m.status === 'failed' ? 'bad' : 'warn'}>{m.status}</StatusBadge></td>
                  <td className="mono" style={{ textAlign: 'right' }}>{m.submitted}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{m.final}</td>
                </tr>
              )) : <tr><td className="empty-cell" colSpan={10}>Search an identifier, or narrow by status. An MSISDN with many matches must be narrowed rather than guessed.</td></tr>}
            </tbody>
          </table>
        </div>
      </Panel>

      <Dialog
        open={Boolean(selected)}
        title={selected ? selected.id : ''}
        onClose={() => setSelected(null)}
        footer={selected ? (
          <>
            <button className="secondary-button" onClick={() => setSummary(true)}>Diagnostic summary</button>
            <button className="secondary-button" onClick={() => { onNavigate('/smpp-errors'); setSelected(null); }}>Correlated errors</button>
            <button className="secondary-button" onClick={() => { onNavigate('/logs'); setSelected(null); }}>Open logs at this time</button>
          </>
        ) : null}
      >
        {selected ? (
          <div style={{ display: 'grid', gap: 16 }}>
            <p style={{ margin: 0, padding: 12, borderRadius: 10, background: 'var(--surface-2)', color: 'var(--text-strong)', lineHeight: 1.5 }}>{selected.body}</p>

            <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(130px, auto) minmax(0, 1fr)', gap: '6px 16px', margin: 0 }}>
              {[['Destination', selected.msisdn], ['Sender', selected.sender], ['Carrier', selected.carrier], ['SMSC', selected.smsc], ['Route', selected.route], ['Carrier message ID', selected.carrierId], ['Status', selected.status]].map(([label, value]) => (
                <React.Fragment key={label}>
                  <dt style={{ color: 'var(--muted)', fontSize: 13 }}>{label}</dt>
                  <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
                </React.Fragment>
              ))}
            </dl>

            {firstBad ? (
              <p style={{ margin: 0, padding: '10px 13px', borderRadius: 8, fontSize: 13.5, color: 'var(--bad)', background: 'color-mix(in srgb, var(--bad) 10%, transparent)' }}>
                First abnormal stage: <strong>{firstBad.label}</strong> — {firstBad.detail}
              </p>
            ) : null}

            <div>
              <div className="t-caps" style={{ marginBottom: 8 }}>Lifecycle</div>
              <Timeline items={stages} />
            </div>
          </div>
        ) : null}
      </Dialog>

      <Dialog
        open={summary}
        title="Diagnostic summary"
        onClose={() => setSummary(false)}
        footer={<button className="secondary-button" onClick={() => setSummary(false)}>Copy</button>}
      >
        {selected ? (
          <pre className="mono" style={{ margin: 0, padding: 14, background: 'var(--surface-2)', border: '1px solid var(--border)', borderRadius: 10, fontSize: 12.5, lineHeight: 1.7, overflow: 'auto', color: 'var(--text-strong)', whiteSpace: 'pre-wrap' }}>
{'Message ' + selected.id + '\n' +
 'Carrier message ID: ' + selected.carrierId + '\n' +
 'Destination: ' + selected.msisdn + ' (' + selected.carrier + ')\n' +
 'Route: ' + selected.route + ' → ' + selected.smsc + '\n' +
 'Submitted: ' + selected.submitted + ' EAT · final: ' + selected.final + '\n' +
 'Outcome: ' + selected.status + '\n' +
 (firstBad ? 'First abnormal stage: ' + firstBad.label + ' — ' + firstBad.detail : 'All stages completed normally.')}
          </pre>
        ) : null}
      </Dialog>
    </>
  );
}

/* ---- ui_kits/console/EventsScreen.jsx ---- */
/* Section 12.1: the structured event stream every other screen links into.
   Correlation ID is a first-class column so an incident can be reconstructed. */
const EVENT_TYPES = ['any', 'connection.lost', 'session.bind.failed', 'throttle.detected', 'queue.threshold.crossed', 'dlr.degradation', 'route.failover.manual', 'telemetry.stale', 'operator.action'];

function EventsScreen({ onNavigate, range }) {
  const [type, setType] = React.useState('any');
  const [severity, setSeverity] = React.useState('any');
  const [correlation, setCorrelation] = React.useState('');

  const rows = EVENTS.filter((e) =>
    (type === 'any' || e.type === type) &&
    (severity === 'any' || e.severity === severity) &&
    (!correlation || e.correlation === correlation)
  );

  return (
    <Panel
      title="Events"
      subtitle={'Structured operational events, last ' + range + ' — filter to one correlation ID to reconstruct an incident'}
      action={
        <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>

            {EVENT_TYPES.map((t) => <option key={t}>{t}</option>)}
          </FilterSelect>
          <FilterSelect label="Severity" value={severity} onChange={(e) => setSeverity(e.target.value)}>
            {['any', 'critical', 'warning', 'info'].map((s) => <option key={s}>{s}</option>)}
          </FilterSelect>
          <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => setCorrelation('')} disabled={!correlation}>Clear correlation</button>
        </span>
      }
    >
      {correlation ? (
        <p className="notice" style={{ margin: '14px 0 0' }}>
          Showing one incident: correlation <span className="mono">{correlation}</span>. {rows.length} events.
        </p>
      ) : null}
      <div className="table-wrap">
        <table>
          <thead><tr><th>When</th><th>Type</th><th>Severity</th><th>Object</th><th>Detail</th><th>Correlation</th><th>Evidence</th></tr></thead>
          <tbody>
            {rows.length ? rows.map((e) => (
              <tr key={e.at + e.type}>
                <td className="mono">{e.at}</td>
                <td className="mono" style={{ fontSize: 12.5 }}>{e.type}</td>
                <td><StatusBadge tone={e.severity === 'critical' ? 'bad' : e.severity === 'warning' ? 'warn' : 'info'}>{e.severity}</StatusBadge></td>
                <td className="mono">{e.object}</td>
                <td style={{ color: 'var(--muted)' }}>{e.detail}</td>
                <td>
                  <button className="text-button mono" style={{ fontSize: 12.5 }} onClick={() => setCorrelation(e.correlation)}>{e.correlation}</button>
                </td>
                <td className="row-actions">
                  <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => onNavigate('/logs')}>Logs</button>
                </td>
              </tr>
            )) : <tr><td className="empty-cell" colSpan={7}>No events match these filters in the selected window.</td></tr>}
          </tbody>
        </table>
      </div>
      <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 14 }}>
        Every alert, carrier event, queue threshold and operator action shares this stream, which is what makes
        an incident reconstructable after the fact.
      </p>
    </Panel>
  );
}

/* Section 12.2: live tail with pause, component and severity filters, a context
   window around a selected event, and an explicit retention boundary. */
const LINES = [
  { at: '01:41:12.884', level: 'warn', component: 'bearerbox', object: 'mtn_ug_trx1', correlation: 'c-8f14e45f', message: 'SMPP[mtn_ug_trx1]: throttled, backing off 200ms' },
  { at: '01:41:11.002', level: 'error', component: 'bearerbox', object: 'TRX-01', correlation: 'c-8f14e45f', message: 'SMPP[mtn_ug_trx1]: submit_sm_resp status 0x0000000B for message kmx_01HXQ4K2R9' },
  { at: '01:41:10.884', level: 'info', component: 'bearerbox', object: 'TRX-01', correlation: 'c-8f14e45f', message: 'SMPP[mtn_ug_trx1]: submit_sm sent, sequence 884102' },

  { at: '01:19:58.221', level: 'error', component: 'bearerbox', object: 'utl_ug_trx', correlation: 'c-ea1e4d54', message: 'SMPP[utl_ug_trx]: 6 missed enquire_link responses, closing session' },
  { at: '01:19:31.008', level: 'warn', component: 'bearerbox', object: 'utl_ug_trx', correlation: 'c-ea1e4d54', message: 'SMPP[utl_ug_trx]: enquire_link timeout after 5000ms' },
  { at: '00:12:31.442', level: 'warn', component: 'metrics-collector', object: 'smile_ug_tx', correlation: 'c-45fea1e4', message: 'scrape failed: context deadline exceeded — marking health unknown' },

function LogsScreen() {
  const [paused, setPaused] = React.useState(false);

  const [component, setComponent] = React.useState('any');
  const [query, setQuery] = React.useState('');
  const [context, setContext] = React.useState(null);

  const rows = LINES.filter((l) =>
    (level === 'any' || l.level === level) &&
    (component === 'any' || l.component === component) &&
    (!query.trim() || (l.message + l.object + l.correlation).toLowerCase().includes(query.trim().toLowerCase()))

  return (

      title="Logs"

/* Section 15 and UC-TST-01. Six tools; only Test SMS transmits, and it is tagged
   as operational test traffic so it can be told from production in traces and
   events. The connectivity test reports how far it actually got. */
const TOOL_TABS = [
  { id: 'connectivity', label: 'SMPP connectivity' },
  { id: 'test-sms', label: 'Test SMS' },
  { id: 'dlr', label: 'DLR lookup' },
  { id: 'encoding', label: 'Encoding analyser' },
  { id: 'number', label: 'Number lookup' },

function ToolsScreen({ onNavigate }) {
  const [tab, setTab] = React.useState('connectivity');
  const [smsc, setSmsc] = React.useState('mtn_ug_trx1');

  const [dest, setDest] = React.useState('+256772000118');
  const [text, setText] = React.useState('Kamex operational test — please ignore.');

  const [sent, setSent] = React.useState(null);
  const [lookup, setLookup] = React.useState('');
  const [dlrResult, setDlrResult] = React.useState(null);
  const [numberResult, setNumberResult] = React.useState(null);

  const unicode = /[^\u0000-\u007F]/.test(text);
  const limit = unicode ? 70 : 160;
  const multi = text.length > limit;
  const perPart = unicode ? 67 : 153;
  const segments = multi ? Math.ceil(text.length / perPart) : 1;

  const runProbe = () => {
    const target = SMSCS.find((s) => s.id === smsc);
    setProbe(
      target.state === 'disconnected'
        ? { level: 'tcp_failed', tone: 'bad', detail: 'TCP connect to ' + target.endpoint + ' refused (errno 111). The carrier is not accepting connections from this host.' }
        : { level: 'smpp_bind', tone: 'good', detail: 'A real bind_transceiver was accepted (ESME_ROK) and released cleanly. Credentials are proven — the password was never sent to the browser.' }
    );
  };

  const send = (reason) => {
    setSent({
      id: 'kmx_test_01HXQ5T2',
      reason,
      stages: [
        { at: '01:44:02.114', label: 'accepted', detail: 'tagged as operational test traffic', state: 'ok' },
        { at: '01:44:02.140', label: 'route decision', detail: smsc + ' selected (pinned by operator)', latency: '26 ms', state: 'ok' },
        { at: '01:44:02.402', label: 'submit_sm', detail: 'sent on session TRX-01', latency: '262 ms', state: 'ok' },
        { at: '01:44:02.518', label: 'submit_sm_resp', detail: 'ESME_ROK, carrier message ID 448902-mtn', latency: '116 ms', state: 'ok' },
        { at: '01:44:06.204', label: 'DLR', detail: 'DELIVRD, err:000', latency: '3.69 s', state: 'ok' },
      ],
    });
    setPending(false);
  };

  return (
    <>
      <Tabs tabs={TOOL_TABS} value={tab} onChange={(id) => { setTab(id); setProbe(null); setSent(null); }} style={{ marginBottom: 16 }} />

      {tab === 'connectivity' ? (
        <section className="split-grid">
          <Panel title="SMPP connectivity test" subtitle="Validates reachability and, where safe, a controlled bind">
            <div style={{ display: 'grid', gap: 14, marginTop: 16 }}>
              <label className="field" style={{ margin: 0 }}>
                <span>SMSC</span>
                <select value={smsc} onChange={(e) => { setSmsc(e.target.value); setProbe(null); }}>
                  {SMSCS.map((s) => <option key={s.id}>{s.id}</option>)}
                </select>
              </label>
              <div><button className="primary-button" onClick={runProbe}>Run test</button></div>
            </div>
          </Panel>
          <Panel title="Result" subtitle="Read how far the attempt got, not just whether it passed">
            {probe ? (
              <div style={{ display: 'grid', gap: 12, marginTop: 16 }}>
                <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                  <StatusBadge tone={probe.tone}>{probe.level}</StatusBadge>
                  <span className="mono" style={{ fontSize: 13, color: 'var(--muted)' }}>{smsc}</span>
                </div>
                <p style={{ margin: 0, fontSize: 14, color: 'var(--text)', lineHeight: 1.6 }}>{probe.detail}</p>
                <p style={{ margin: 0, fontSize: 13.5, color: 'var(--muted)' }}>
                  A verification level of <span className="mono">tcp_socket</span> proves only that a socket opened.

                </p>
              </div>
            ) : <p className="chart-empty">Run the test to see its verification level.</p>}
          </Panel>
        </section>
      ) : null}

      {tab === 'test-sms' ? (

      {tab === 'dlr' ? (

                  { at: '—', label: 'intermediate DLR', detail: 'none: nothing was accepted for delivery', state: 'missing' },
                  { at: '—', label: 'final DLR', detail: 'none expected — the message never entered the carrier network', state: 'missing' },
                ]} />

      {tab === 'encoding' ? (
        <section className="split-grid">
          <Panel title="Encoding and segment analyser" subtitle="What the payload will actually cost on the wire">
            <label className="field" style={{ margin: '16px 0 0' }}><span>Message</span><textarea rows={5} value={text} onChange={(e) => setText(e.target.value)} /></label>
          </Panel>

/* Section 14: the service register. A gateway grows instances (several smsboxes,
   collectors, workers per node), so this stays a filterable list and each service
   opens its own page rather than expanding detail underneath. */
const STATE_ORDER = { critical: 0, degraded: 1, unknown: 2, healthy: 3 };

function ServicesScreen({ onNavigate }) {
  const [query, setQuery] = React.useState('');
  const [state, setState] = React.useState('any');
  const [sort, setSort] = React.useState('state');

  const rows = SERVICES
    .filter((s) =>
      (state === 'any' || s.state === state) &&
      (!query.trim() || (s.name + ' ' + s.role).toLowerCase().includes(query.trim().toLowerCase()))
    )
    .sort((a, b) =>
      sort === 'state' ? (STATE_ORDER[a.state] ?? 9) - (STATE_ORDER[b.state] ?? 9)
      : sort === 'cpu' ? b.cpu - a.cpu
      : sort === 'memory' ? b.ram - a.ram
      : a.name.localeCompare(b.name)
    );

  const unhealthy = SERVICES.filter((s) => s.state !== 'healthy').length;

  return (
    <>
      <p className="stale-banner">
        The metrics collector restarted 1h 12m ago and its last scrape of smile_ug_tx failed. Anything it
        watches is reported unknown until a scrape succeeds — not healthy.
      </p>

      <Panel
        title="Services"
        subtitle={unhealthy + ' of ' + SERVICES.length + ' components need attention. Select one to open its page.'}
        action={
          <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <FilterSelect label="State" value={state} onChange={(e) => setState(e.target.value)}>
              {['any', 'critical', 'degraded', 'unknown', 'healthy'].map((s) => <option key={s}>{s}</option>)}
            </FilterSelect>
            <FilterSelect label="Sort" value={sort} onChange={(e) => setSort(e.target.value)}>
              {['state', 'cpu', 'memory', 'name'].map((s) => <option key={s}>{s}</option>)}
            </FilterSelect>
            <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }}>Export CSV</button>
          </span>
        }
      >
        <div className="grid-toolbar" style={{ marginTop: 14 }}>
          <label className="filter-search" style={{ flex: '1 1 260px' }}>
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search service or responsibility" />
          </label>
        </div>

        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Service</th><th>Responsibility</th><th>State</th>
                <th style={{ textAlign: 'right' }}>Uptime</th><th style={{ textAlign: 'right' }}>CPU</th>
                <th style={{ textAlign: 'right' }}>Memory</th><th style={{ textAlign: 'right' }}>Rate</th>
                <th>Detail</th><th></th>
              </tr>
            </thead>
            <tbody>
              {rows.length ? rows.map((s) => (
                <tr key={s.name} className="selectable" onClick={() => onNavigate('/services/' + s.name)}>
                  <td className="mono">{s.name}</td>
                  <td style={{ color: 'var(--muted)' }}>{s.role}</td>
                  <td><StatusBadge tone={healthTone(s.state)}>{s.state}</StatusBadge></td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.uptime}</td>
                  <td className="figures" style={{ textAlign: 'right', color: s.cpu > 70 ? 'var(--warn)' : undefined }}>{s.cpu}%</td>
                  <td className="figures" style={{ textAlign: 'right', color: s.ram > 70 ? 'var(--warn)' : undefined }}>{s.ram}%</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.rate}</td>
                  <td style={{ color: 'var(--muted)' }}>{s.detail}</td>
                  <td className="row-actions">
                    <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={(e) => { e.stopPropagation(); onNavigate('/services/' + s.name); }}>
                      Open
                    </button>
                  </td>
                </tr>
              )) : <tr><td className="empty-cell" colSpan={9}>No service matches this filter.</td></tr>}
            </tbody>
          </table>
        </div>

        <div className="pager">
          <span>Showing {rows.length} of {SERVICES.length} services</span>
          <span style={{ display: 'flex', gap: 8 }}>
            <button className="secondary-button" disabled>Previous</button>
            <button className="secondary-button" disabled>Next</button>
          </span>
        </div>
      </Panel>
    </>
  );
}

        <button className="primary-button" style={{ marginTop: 14 }} onClick={() => onNavigate('/services')}>Back to Services</button>
      </Panel>
    );
  }

  const deps = DEPENDENCIES[serviceName] || [];
  const dependents = Object.entries(DEPENDENCIES).filter(([, list]) => list.includes(serviceName)).map(([name]) => name);
  const rootCause = deps.find((d) => {
    const dep = SERVICES.find((s) => s.name === d);
    return dep && dep.state !== 'healthy';
  });
  const history = SERVICE_HISTORY[serviceName];

  return (
    <>
      {result ? <p className="notice" style={{ marginBottom: 14 }}>{result}</p> : null}

      <section className="metrics-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))' }}>
        <MetricCard label="State" value={service.state} detail={service.detail} icon="alert" tone={healthTone(service.state) === 'good' ? 'good' : healthTone(service.state) === 'warn' ? 'warn' : 'bad'} />
        <MetricCard label="Uptime" value={service.uptime} detail="since last process start" icon="cog" />
        <MetricCard label="CPU" value={service.cpu + '%'} detail="of its container limit" icon="chart" tone={service.cpu > 70 ? 'warn' : 'primary'} />
        <MetricCard label="Memory" value={service.ram + '%'} detail="of its container limit" icon="db" tone={service.ram > 70 ? 'warn' : 'primary'} />
        <MetricCard label="Throughput" value={service.rate} detail={service.role} icon="server" />
      </section>

      <section className="split-grid">
        <Panel
          title={service.name}
          subtitle={service.role}
          action={
            <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => onNavigate('/logs')}>Open logs</button>
              <button className="secondary-button danger-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={() => setRestart(true)}>Restart</button>
            </span>
          }
        >
          <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(140px, auto) minmax(0, 1fr)', gap: '8px 16px', margin: '16px 0 0' }}>
            {[['State', service.state], ['Uptime', service.uptime], ['CPU', service.cpu + '%'], ['Memory', service.ram + '%'], ['Throughput', service.rate], ['Detail', service.detail]].map(([label, value]) => (
              <React.Fragment key={label}>
                <dt style={{ color: 'var(--muted)', fontSize: 13.5 }}>{label}</dt>
                <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
              </React.Fragment>
            ))}
          </dl>

          {history ? (
            <div style={{ marginTop: 20 }}>
              <div className="t-caps" style={{ marginBottom: 8 }}>Recent process and health events</div>
              <Timeline dense items={history} />
            </div>
          ) : null}
        </Panel>

        <Panel title="Dependencies" subtitle={rootCause ? 'A dependency is unhealthy — this service may be a symptom, not the cause' : 'Root failure or downstream symptom'}>
          <div style={{ display: 'grid', gap: 16, marginTop: 16 }}>
            <div>
              <div className="t-caps" style={{ marginBottom: 8 }}>Depends on</div>
              {deps.length ? (
                <ul className="health-list" style={{ margin: 0 }}>
                  {deps.map((d) => {
                    const dep = SERVICES.find((s) => s.name === d);
                    return (
                      <li key={d} className="selectable" onClick={() => onNavigate('/services/' + d)}>
                        <span className={'status-dot ' + (healthTone(dep.state) === 'good' ? 'good' : healthTone(dep.state) === 'warn' ? 'warn' : 'bad')} />
                        <span><strong>{d}</strong><small>{dep.detail}</small></span>
                        <StatusBadge tone={healthTone(dep.state)}>{dep.state}</StatusBadge>
                      </li>
                    );
                  })}
                </ul>
              ) : <p style={{ color: 'var(--muted)', fontSize: 13.5, margin: 0 }}>Nothing — this is a root service.</p>}
            </div>

            <div>
              <div className="t-caps" style={{ marginBottom: 8 }}>Affected if this fails</div>
              {dependents.length ? (
                <ul className="health-list" style={{ margin: 0 }}>
                  {dependents.map((d) => {
                    const dep = SERVICES.find((s) => s.name === d);
                    return (
                      <li key={d} className="selectable" onClick={() => onNavigate('/services/' + d)}>
                        <span className={'status-dot ' + (healthTone(dep.state) === 'good' ? 'good' : healthTone(dep.state) === 'warn' ? 'warn' : 'bad')} />
                        <span><strong>{d}</strong><small>{dep.role}</small></span>
                        <StatusBadge tone={healthTone(dep.state)}>{dep.state}</StatusBadge>
                      </li>
                    );
                  })}
                </ul>
              ) : <p style={{ color: 'var(--muted)', fontSize: 13.5, margin: 0 }}>No other service depends on it.</p>}
            </div>

            <p style={{ margin: 0, fontSize: 13.5, color: 'var(--muted)', lineHeight: 1.6 }}>
              {rootCause
                ? 'Fix ' + rootCause + ' first. Restarting ' + service.name + ' while its dependency is unhealthy usually changes nothing.'
                : service.state === 'healthy'
                  ? 'This service is healthy. If traffic is affected, look upstream at the carrier rather than here.'
                  : 'No unhealthy dependency, so this looks like a root failure in ' + service.name + '.'}
            </p>
          </div>
        </Panel>
      </section>

      <ConfirmAction
        open={restart}
        title={'Restart ' + service.name}
        verb="Restart"
        danger
        warning={dependents.length ? 'Restarting this service interrupts ' + dependents.join(', ') + '. Carrier submissions pause until it is back and healthy.' : null}
        impact={[
          ['Current state', service.state],
          ['Uptime lost', service.uptime],
          ['Dependent services', dependents.length ? dependents.join(', ') : 'none'],
          ['Traffic impact', service.name === 'bearerbox' ? 'all carrier submissions pause, typically 10-30s' : 'submissions handled by the sibling instance'],
          ['Recovery check', 'health and downstream SMSC impact are monitored after restart'],
        ]}
        onClose={() => setRestart(false)}
        onConfirm={(reason) => { setResult('Restart of ' + service.name + ' issued — reason recorded: ' + reason + '. Watching health and downstream SMSC impact.'); setRestart(false); }}
      />
    </>
  );
}

      <span className="breakdown-track" style={{ height: 7 }}>

};

        ) : null}

        {selected ? (

  '/dlr': { title: 'DLR Performance', subtitle: 'Delivery funnel, status breakdown and carrier quality over identical windows.', crumbs: ['Traffic', 'DLR Performance'], analytical: true, render: (p) => <DlrScreen {...p} /> },

  '/simulator': { title: 'Route Simulator', subtitle: 'Resolve where a destination would be sent. Non-transmitting.', crumbs: ['Routing', 'Route Simulator'], render: (p) => <SimulatorScreen {...p} /> },

  '/trace': { title: 'Message Trace', subtitle: 'One message end to end, with the first abnormal or missing stage called out.', crumbs: ['Diagnostics', 'Message Trace'], render: (p) => <TraceScreen {...p} /> },

/* A carrier has its own page at /carriers/<id>: the register can grow to dozens
   of networks, so detail must not live underneath the list. */
function resolve(route) {
  if (route.startsWith('/carriers/')) {
    const id = route.slice('/carriers/'.length);
    const carrier = CARRIERS.find((c) => c.id === id);
    return {
      title: carrier ? carrier.name : 'Carrier',
      subtitle: carrier
        ? carrier.country + ' · network ' + carrier.mcc + '-' + carrier.mnc + ' · prefixes ' + carrier.prefixes
        : 'This carrier is not in the register.',
      crumbs: ['Connectivity', { label: 'Carriers', to: '/carriers' }, carrier ? carrier.name : id],
      analytical: true,
      render: (p) => <CarrierDetailScreen carrierId={id} {...p} />,
    };
  }
  if (route.startsWith('/smscs/')) {
    const id = route.slice('/smscs/'.length);
    const smsc = SMSCS.find((s) => s.id === id);
    return {
      title: smsc ? smsc.id : 'SMSC',
      subtitle: smsc
        ? smsc.carrier + ' · ' + smsc.country + ' · ' + smsc.protocol + ' · sessions, queue, routing and controlled actions'
        : 'This connection is not in the register.',
      crumbs: ['Connectivity', { label: 'SMSCs', to: '/smscs' }, smsc ? smsc.id : id],
      analytical: true,
      render: (p) => <SmscDetailScreen smscId={id} {...p} />,
    };
  }
  if (route.startsWith('/services/')) {
    const name = route.slice('/services/'.length);
    const service = SERVICES.find((s) => s.name === name);
    return {
      title: service ? service.name : 'Service',
      subtitle: service
        ? service.role + ' · root failure or downstream symptom, and the controls that are safe to use'
        : 'This component is not in the register.',
      crumbs: ['System', { label: 'Services', to: '/services' }, service ? service.name : name],
      render: (p) => <ServiceDetailScreen serviceName={name} {...p} />,
    };
  }
  return PAGES[route] || PAGES['/dashboard'];
}

/* Telemetry is honest per screen: the metrics collector restarted recently, so the
   screens that depend on its scrape report delayed rather than live. */
const DELAYED = ['/services', '/nodes', '/performance'];

function App() {
  const [signedIn, setSignedIn] = React.useState(false);
  const [route, setRoute] = React.useState('/dashboard');
  const [range, setRange] = React.useState('1h');
  const [theme, setTheme] = React.useState('light');

  React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  React.useEffect(() => { window.scrollTo(0, 0); }, [route]);

  if (!signedIn) return <LoginScreen onSignIn={() => setSignedIn(true)} />;

  const page = resolve(route);

  return (
    <AppShell
      route={route}
      onNavigate={setRoute}
      range={range}
      onRange={setRange}
      showRange={Boolean(page.analytical)}
      freshness={DELAYED.some((r) => route === r || route.startsWith(r + '/')) ? 'delayed' : 'live'}
      theme={theme}
      onToggleTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
      onLogout={() => setSignedIn(false)}
      breadcrumbs={page.crumbs}
      title={page.title}
      subtitle={page.subtitle}
    >
      {page.render({ onNavigate: setRoute, range })}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
