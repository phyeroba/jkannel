const ICON_NAMES = Object.keys(ICONS);

function Icon({ name, size = 18, style, ...rest }) {
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="1.7"
      strokeLinecap="round"
      strokeLinejoin="round"
      aria-hidden="true"
      style={style}
      dangerouslySetInnerHTML={{ __html: ICONS[name] || ICONS.cog }}
      {...rest}
    />
  );
}

/* ---- components/core/Button.jsx ---- */
/* Three shipped button classes: primary (filled violet), secondary (hairline
   on surface), danger (bad-tinted). Plus the transparent icon button. */
function Button({ variant = 'primary', icon, children, style, ...rest }) {
  const cls =
    variant === 'secondary' ? 'secondary-button' : variant === 'danger' ? 'danger-button' : 'primary-button';
  return (
    <button className={cls} style={style} {...rest}>
      {icon ? <Icon name={icon} size={16} /> : null}
      {children}
    </button>
  );
}

function IconButton({ icon, label, size = 18, ...rest }) {
  return (
    <button className="icon-button" aria-label={label} {...rest}>
      <Icon name={icon} size={size} />
    </button>
  );
}

/* ---- components/core/Panel.jsx ---- */
/* Card surface: no border in light theme, --shadow, 10px radius, 20px pad. */
function Panel({ title, subtitle, action, wide, children, style, ...rest }) {
  return (
    <article className={wide ? 'panel wide' : 'panel'} style={style} {...rest}>
      {title || action ? (
        <header className="panel-header">
          <div>
            <h2>{title}</h2>
            {subtitle ? <p>{subtitle}</p> : null}
          </div>
          {action}
        </header>
      ) : null}
      {children}
    </article>
  );
}

/* ---- components/core/MetricCard.jsx ---- */
/* Ported from frontend/src/components/MetricCard.vue: label + soft-tint icon
   chip, 24/700 figure, muted detail line. */
function MetricCard({ label, value, detail, icon = 'chart', tone = 'primary', ...rest }) {
  return (
    <article className="metric-card" title={detail || undefined} {...rest}>
      <span className={tone === 'primary' ? 'metric-icon' : 'metric-icon ' + tone}>
        <Icon name={icon} size={17} />
      </span>
      <span className="metric-body">
        <strong className={typeof value === "string" && /[a-z]{4,}/i.test(value) ? "metric-word" : undefined}>{value}</strong>
        <small>{label}</small>
      </span>
    </article>
  );
}

/* ---- components/core/StatusBadge.jsx ---- */
/* One status language for the whole console: soft-tinted pill, capitalized. */
const TONES = {
  healthy: 'good', available: 'good', running: 'good', connected: 'good', active: 'good', ok: 'good', up: 'good',
  delivered: 'info', distributed: 'info',
  checking: 'warn', unknown: 'warn', degraded: 'warn', pending: 'warn', processing: 'warn',
  failed: 'bad', offline: 'bad', critical: 'bad', disabled: 'bad', expired: 'bad',
};

function statusTone(status) {
  return TONES[String(status).toLowerCase()] || 'bad';
}

function StatusBadge({ children, tone, status }) {
  const resolved = tone || statusTone(status ?? children);
  return <span className={'status-badge ' + resolved}>{status ?? children}</span>;
}

function StatusDot({ tone = 'good', status }) {
  return <span className={'status-dot ' + (status ? statusTone(status) : tone)} />;
}

/* ---- components/forms/Field.jsx ---- */
function Field({ label, hint, children, ...rest }) {
  return (
    <label className="field" {...rest}>
      <span>{label}</span>
      {children}
      {hint ? <small style={{ color: 'var(--muted)', fontSize: 12 }}>{hint}</small> : null}
    </label>
  );
}

function TextInput({ label, hint, ...rest }) {
  return (
    <Field label={label} hint={hint}>
      <input {...rest} />
    </Field>
  );
}

function PasswordInput({ label = 'Password', ...rest }) {
  const [shown, setShown] = React.useState(false);
  return (
    <div className="field" style={{ position: 'relative' }}>
      <span style={{ fontSize: 13, fontWeight: 500, color: 'var(--text-strong)' }}>{label}</span>
      <div style={{ position: 'relative' }}>
        <input type={shown ? 'text' : 'password'} style={{ paddingRight: 40 }} {...rest} />
        <button
          type="button"
          aria-label={shown ? 'Hide password' : 'Show password'}
          onClick={() => setShown(!shown)}
          style={{
            position: 'absolute', right: 9, top: '50%', transform: 'translateY(-50%)',
            display: 'flex', border: 0, background: 'transparent', color: 'var(--muted)', padding: 4, cursor: 'pointer',
          }}
        >
          <Icon name={shown ? 'eyeoff' : 'eye'} />
        </button>
      </div>
    </div>
  );
}

function FilterSelect({ label, children, ...rest }) {
  return (
    <label className="filter-select">
      <span>{label}</span>
      <select {...rest}>{children}</select>
    </label>
  );
}

/* ---- components/data/DataTable.jsx ---- */
/* Uppercase 10.5px faint headers, hairline row rules, mono IDs,
   right-aligned tabular figures, honest empty state. */
function DataTable({ columns, rows, empty = 'No records yet.', renderCell }) {
  return (
    <div className="table-wrap">
      <table>
        <thead>
          <tr>
            {columns.map((col) => (
              <th key={col.key} style={col.align === 'right' ? { textAlign: 'right' } : undefined}>
                {col.label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.length ? (
            rows.map((row, i) => (
              <tr key={row.id ?? i}>
                {columns.map((col) => (
                  <td
                    key={col.key}
                    className={col.mono ? 'mono' : undefined}
                    style={col.align === 'right' ? { textAlign: 'right' } : undefined}
                  >
                    {renderCell ? renderCell(col, row) : row[col.key]}
                  </td>
                ))}
              </tr>
            ))
          ) : (
            <tr>
              <td className="empty-cell" colSpan={columns.length}>{empty}</td>
            </tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

/* ---- components/data/MiniChart.jsx ---- */
/* Dependency-free SVG series chart (ported from MiniChart.vue): dashed grid,
   tabular tick labels, brand/info strokes, legend below. */
/* The chart fills its panel, so the viewBox is measured in real pixels rather
   than fixed units: scaling a fixed viewBox up to a wide panel would magnify the
   tick labels with it. */
function MiniChart({ series, height = 160, width: fixedWidth, labels = [], showLegend = true }) {
  const hostRef = React.useRef(null);
  const [measured, setMeasured] = React.useState(fixedWidth || 560);
  React.useEffect(() => {
    if (fixedWidth) return;
    const host = hostRef.current;
    if (!host) return;
    const read = () => {
      const w = Math.round(host.clientWidth) - 44;
      if (w > 80) setMeasured(w);
    };
    read();
    window.addEventListener('resize', read);
    let ro = null;
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(read);
      ro.observe(host);
    }
    return () => {
      window.removeEventListener('resize', read);
      if (ro) ro.disconnect();
    };
  }, [fixedWidth]);
  const width = fixedWidth || measured;
  const max = Math.max(1, ...series.flatMap((s) => s.values));
  const gridLines = 4;
  const colors = ['var(--brand)', 'var(--info)', 'var(--warn)'];
  const x = (i, n) => (n <= 1 ? 0 : (i / (n - 1)) * width);
  const y = (v) => height - (v / max) * height;
  return (
    <figure ref={hostRef} className="mini-chart" style={{ margin: 0, display: 'grid', gap: 8 }}>
      <svg className="mini-chart-svg" viewBox={`-34 -8 ${width + 44} ${height + 30}`} style={{ width: '100%', height: 'auto', overflow: 'visible' }}>
        <g className="mini-chart-grid">
          {Array.from({ length: gridLines + 1 }, (_, i) => {
            const gy = (i / gridLines) * height;
            return <line key={i} x1="0" x2={width} y1={gy} y2={gy} />;
          })}
        </g>
        <g className="mini-chart-grid">
          {Array.from({ length: gridLines + 1 }, (_, i) => (
            <text key={i} className="mini-chart-tick" x="-8" y={(i / gridLines) * height + 3} textAnchor="end" style={{ fill: 'var(--muted)', fontSize: 10 }}>
              {Math.round(max - (i / gridLines) * max)}
            </text>
          ))}
        </g>
        {series.map((s, si) => (
          <g key={s.name}>
            <polyline
              fill="none"
              stroke={colors[si % colors.length]}
              strokeWidth="2"
              strokeLinejoin="round"
              points={s.values.map((v, i) => `${x(i, s.values.length)},${y(v)}`).join(' ')}
            />
          </g>
        ))}
        {labels.map((label, i) => (
          <text key={label + i} className="mini-chart-tick" x={x(i, labels.length)} y={height + 16} textAnchor="middle" style={{ fill: 'var(--muted)', fontSize: 10 }}>
            {label}
          </text>
        ))}
      </svg>
      {showLegend ? (
        <figcaption className="mini-chart-legend">
          {series.map((s, si) => (
            <span className="mini-chart-legend-item" key={s.name} style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
              <i className="mini-chart-swatch" style={{ background: colors[si % colors.length] }} />
              {s.name}
            </span>
          ))}
        </figcaption>
      ) : null}
    </figure>
  );
}

/* CSS-bar volume chart used on the operations dashboard. */
function BarChart({ values, titleFor }) {
  const max = Math.max(1, ...values);
  return (
    <div className="chart" aria-label="Daily message volume">
      {values.map((v, i) => (
        <div key={i} style={{ height: `${Math.max(4, Math.round((v / max) * 100))}%` }} title={titleFor ? titleFor(v, i) : String(v)} />
      ))}
    </div>
  );
}

/* ---- components/data/Timeline.jsx ---- */
/* Sequence is read, not inferred. Used for bind history, message lifecycle and
   alert lifecycle: a rail of dots with a time, a label and its evidence. */
const TIMELINE_TONES = { ok: 'var(--good)', warn: 'var(--warn)', error: 'var(--bad)', missing: 'var(--muted)', info: 'var(--info)' };

function Timeline({ items, dense }) {
  return (
    <ol style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: dense ? 10 : 14 }}>
      {items.map((item, i) => (
        <li key={item.at + item.label + i} style={{ display: 'grid', gridTemplateColumns: '84px 14px minmax(0, 1fr)', gap: 10, alignItems: 'start' }}>
          <span className="mono" style={{ fontSize: 11.5, color: 'var(--muted)', paddingTop: 1 }}>{item.at}</span>
          <span style={{ display: 'grid', justifyItems: 'center', gap: 2, paddingTop: 4 }}>
            <span style={{ width: 9, height: 9, borderRadius: '50%', background: TIMELINE_TONES[item.state] || 'var(--brand)', outline: item.state === 'missing' ? '1px dashed var(--muted)' : 'none', outlineOffset: 2 }} />
            {i < items.length - 1 ? <span style={{ width: 1, height: dense ? 18 : 26, background: 'var(--border)' }} /> : null}
          </span>
          <span>
            <strong style={{ display: 'block', fontSize: 13, color: 'var(--text-strong)' }}>{item.label}</strong>
            <span style={{ display: 'block', fontSize: 12.5, color: 'var(--muted)', lineHeight: 1.5 }}>{item.detail}</span>
            {item.latency ? <span className="mono" style={{ display: 'block', fontSize: 11.5, color: 'var(--muted)' }}>+{item.latency}</span> : null}
          </span>
        </li>
      ))}
    </ol>
  );
}

/* ---- components/feedback/Dialog.jsx ---- */
/* Centered card on a dim scrim: 14px radius, deep shadow, Esc + backdrop close. */
function Dialog({ open, title, onClose, footer, children }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="dialog-backdrop" onClick={onClose}>
      <div className="command-dialog" role="dialog" aria-modal="true" onClick={(e) => e.stopPropagation()}>
        <header>
          <h2>{title}</h2>
          <button className="secondary-button" onClick={onClose}>Close</button>
        </header>
        <div className="dialog-body">{children}</div>
        {footer ? <div className="dialog-foot">{footer}</div> : null}
      </div>
    </div>
  );
}

/* The topbar search trigger + Ctrl-K palette that fronts all 33 workspaces. */
function CommandPalette({ open, onClose, items, onPick }) {
  const [query, setQuery] = React.useState('');
  const shown = items.filter((item) => item.label.toLowerCase().includes(query.toLowerCase()));
  return (
    <Dialog open={open} title="Search JKANNEL" onClose={onClose}>
      <input autoFocus placeholder="Jump to a workspace, message ID or SMSC" value={query} onChange={(e) => setQuery(e.target.value)} />
      <div className="search-results">
        {shown.length ? shown.map((item) => (
          <a key={item.to} href="#" onClick={(e) => { e.preventDefault(); onPick && onPick(item.to); }}>
            {item.label}<span>{item.group}</span>
          </a>
        )) : <p className="empty-cell">No workspace matches “{query}”.</p>}
      </div>
    </Dialog>
  );
}

/* ---- components/feedback/Drawer.jsx ---- */
/* Right-hand sheet at half the viewport width, used for record detail opened
   from a register row: the list stays in place behind the scrim so the operator
   keeps their position in the table. Esc and backdrop close it. */
function Drawer({ open, title, subtitle, eyebrow, actions, footer, onClose, children }) {
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose && onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="drawer-scrim" onClick={onClose}>
      <aside className="drawer-sheet" role="dialog" aria-modal="true" aria-label={title} onClick={(e) => e.stopPropagation()}>
        <header className="drawer-head">
          <div style={{ minWidth: 0 }}>
            {eyebrow ? <div className="t-caps" style={{ marginBottom: 4 }}>{eyebrow}</div> : null}
            <h2>{title}</h2>
            {subtitle ? <p>{subtitle}</p> : null}
          </div>
          <div className="drawer-head-actions">
            {actions}
            <button className="secondary-button" onClick={onClose} aria-label="Close">Close</button>
          </div>
        </header>
        <div className="drawer-body">{children}</div>
        {footer ? <div className="drawer-foot">{footer}</div> : null}
      </aside>
    </div>
  );
}

/* ---- components/feedback/ConfirmAction.jsx ---- */
/* A disruptive action is never confirmed with "Are you sure?". The dialog states
   what will be affected, captures a reason for the audit trail, and disables
   itself while the action is in flight (spec §1.1, UC-SMSC-01, §16). */
function ConfirmAction({ open, title, verb = 'Confirm', danger, impact = [], warning, reasons, onClose, onConfirm }) {
  const [reason, setReason] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  React.useEffect(() => { if (open) { setReason(''); setBusy(false); } }, [open]);
  const submit = () => {
    setBusy(true);
    onConfirm(reason || (reasons && reasons[0]) || 'No reason given');
  };
  return (
    <Dialog
      open={open}
      title={title}
      onClose={busy ? undefined : onClose}
      footer={
        <button
          className={danger ? 'secondary-button danger-button' : 'primary-button'}
          disabled={busy}
          onClick={submit}
        >
          {busy ? 'Working…' : verb}
        </button>
      }
    >
      <div style={{ display: 'grid', gap: 14 }}>
        {warning ? (
          <p style={{ margin: 0, padding: '10px 13px', borderRadius: 8, fontSize: 12.5, color: 'var(--bad)', background: 'color-mix(in srgb, var(--bad) 10%, transparent)' }}>{warning}</p>
        ) : null}

        <div>
          <div className="t-caps" style={{ marginBottom: 8 }}>Impact</div>
          <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(140px, auto) minmax(0, 1fr)', gap: '6px 16px', margin: 0 }}>
            {impact.map(([label, value]) => (
              <React.Fragment key={label}>
                <dt style={{ color: 'var(--muted)', fontSize: 12.5 }}>{label}</dt>
                <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
              </React.Fragment>
            ))}
          </dl>
        </div>

        <label className="field" style={{ margin: 0 }}>
          <span>Reason (recorded in the audit trail)</span>
          {reasons ? (
            <select value={reason} onChange={(e) => setReason(e.target.value)}>
              <option value="">Select a reason…</option>
              {reasons.map((r) => <option key={r}>{r}</option>)}
            </select>
          ) : (
            <input value={reason} onChange={(e) => setReason(e.target.value)} placeholder="e.g. Carrier throttling, cycling bind per runbook 4.2" />
          )}
        </label>
      </div>
    </Dialog>
  );
}

/* ---- components/navigation/Tabs.jsx ---- */
function Tabs({ tabs, value, onChange, style }) {
  return (
    <div className="range-select" role="tablist" style={style}>
      {tabs.map((tab) => {
        const id = typeof tab === 'string' ? tab : tab.id;
        const label = typeof tab === 'string' ? tab : tab.label;
        const count = typeof tab === 'string' ? null : tab.count;
        return (
          <button
            key={id}
            role="tab"
            aria-selected={value === id}
            className={value === id ? 'range-button active' : 'range-button'}
            onClick={() => onChange(id)}
          >
            {label}
            {count != null ? <span className="figures" style={{ marginLeft: 6, opacity: 0.65 }}>{count}</span> : null}
          </button>
        );
      })}
    </div>
  );
}

/* ---- ui_kits/console/AppShell.jsx ---- */
/* Information architecture from section 2 of the specification: six sections,
   built on the operational hierarchy Carrier → SMSC → SMPP Session → Route →
   Queue → Message → Delivery Receipt. Customer provisioning, billing, plans and
   customer API credentials are out of scope and absent by design. */

  { name: 'Traffic', icon: 'chart', items: [
    { label: 'Live Traffic', icon: 'chart', to: '/traffic' },
    { label: 'Queues', icon: 'queue', to: '/queues' },
    { label: 'DLR Performance', icon: 'check', to: '/dlr' },
  ]},
  { name: 'Routing', icon: 'route', items: [
    { label: 'Carrier Routes', icon: 'route', to: '/routes' },

    { label: 'Route Simulator', icon: 'spark', to: '/simulator' },
  ]},
  { name: 'Diagnostics', icon: 'terminal', items: [
    { label: 'Message Trace', icon: 'sms', to: '/trace' },
    { label: 'SMPP Errors', icon: 'alert', to: '/smpp-errors' },
    { label: 'Events', icon: 'bell', to: '/events' },
    { label: 'Logs', icon: 'terminal', to: '/logs' },

  ]},

    { label: 'Services', icon: 'docker', to: '/services' },
    { label: 'Nodes', icon: 'db', to: '/nodes' },
    { label: 'Performance', icon: 'chart', to: '/performance' },
    { label: 'Audit Trail', icon: 'shield', to: '/audit' },
    { label: 'Users & Roles', icon: 'users', to: '/users' },
  ]},
];

const NAV_SECTIONS = SECTIONS;
const RANGES = ['15m', '1h', '6h', '24h', '7d'];

/* Telemetry freshness is a first-class control, not decoration: the operator has
   to know whether what they are reading is current (spec §2.1, §17). */
const FRESHNESS = {
  live: { label: 'Live', tone: 'good', detail: 'telemetry current' },
  delayed: { label: 'Delayed', tone: 'warn', detail: 'last update 94s ago' },
  disconnected: { label: 'Disconnected', tone: 'bad', detail: 'no telemetry since 01:28:14' },
};

function AppShell({ route, onNavigate, range, onRange, theme, onToggleTheme, onLogout, children, breadcrumbs, title, subtitle, freshness = 'live', showRange }) {
  const matches = (itemTo, current) => current === itemTo || current.startsWith(itemTo + '/');
  const sectionOf = (to) => (SECTIONS.find((s) => s.items.some((i) => matches(i.to, to))) || {}).name;
  const [openSection, setOpenSection] = React.useState(sectionOf(route) || 'Overview');
  React.useEffect(() => { const s = sectionOf(route); if (s) setOpenSection(s); }, [route]);
  const [drawer, setDrawer] = React.useState(false);
  const [palette, setPalette] = React.useState(false);
  React.useEffect(() => {
    if (!palette) return;
    const onKey = (e) => { if (e.key === 'Escape') setPalette(false); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [palette]);

  const [query, setQuery] = React.useState('');
  const go = (to) => { onNavigate(to); setDrawer(false); setPalette(false); };

  const critical = ALERTS.filter((a) => a.severity === 'critical' && a.state === 'active').length;
  const warning = ALERTS.filter((a) => a.severity === 'warning' && a.state === 'active').length;
  const fresh = FRESHNESS[freshness];

  const targets = SECTIONS.flatMap((s) => s.items.map((i) => ({ ...i, group: s.name })));
  const hits = targets.filter((t) => t.label.toLowerCase().includes(query.trim().toLowerCase()));

  return (
    <div className="app-frame">
      {drawer ? <div className="sidebar-scrim" onClick={() => setDrawer(false)} /> : null}
      <aside className={drawer ? 'sidebar open' : 'sidebar'}>
        <div className="brand">
          <span className="brand-mark"><Icon name="sms" size={20} /></span>
          <span><strong>KAMEX</strong><small>Gateway operations</small></span>
        </div>
        <nav>
          {SECTIONS.map((section) => (
            <div className="nav-group" key={section.name}>
              <button
                className={openSection === section.name ? 'nav-label' : 'nav-label collapsed'}
                aria-expanded={openSection === section.name}
                onClick={() => setOpenSection(openSection === section.name ? null : section.name)}
              >
                <Icon name={section.icon} />
                <span>{section.name}</span>
                <Icon name="chevron" size={14} className="nav-chevron" />
              </button>
              {openSection !== section.name ? null : (
                <div className="nav-items">
                  {section.items.map((item) => (
                    <a
                      key={item.to}
                      href="#"
                      className={matches(item.to, route) ? 'active' : undefined}
                      onClick={(e) => { e.preventDefault(); go(item.to); }}
                    >
                      <Icon name={item.icon} size={17} />
                      <span>{item.label}</span>
                      {item.to === '/alerts' && critical ? <span className="nav-badge">{critical + warning}</span> : null}
                    </a>
                  ))}
                </div>
              )}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <span className={'status-dot ' + (fresh.tone === 'good' ? 'good' : fresh.tone === 'warn' ? 'warn' : 'bad')} />
          <span><strong style={{ color: '#fff' }}>kamex 1.8.3</strong><small>2 nodes · {SMSCS.length} SMSCs</small></span>
        </div>
      </aside>

      <div className="shell">
        <header className="topbar">
          <button className="icon-button nav-toggle" aria-label="Open navigation" onClick={() => setDrawer(true)}>
            <Icon name="menu" />
          </button>

          {/* Environment is called out strongly: a control action on Production
              must never be mistaken for one on Staging (spec §2.1). */}
          <span className="env-chip env-production" title="You are operating on the production gateway">
            <span className="env-dot" />Production
          </span>

          <button className="search-trigger" onClick={() => setPalette(true)}>
            <Icon name="search" size={18} />
            <span>Search carrier, SMSC, session, message ID or MSISDN</span>
            <kbd>Ctrl K</kbd>
          </button>

          <div className="top-actions">
            {showRange ? (
              <label className="filter-select topbar-range">
                <span>Range</span>
                <select value={range} onChange={(e) => onRange(e.target.value)}>
                  {RANGES.map((r) => <option key={r}>{r}</option>)}
                </select>
              </label>
            ) : null}

            <span className={'freshness freshness-' + fresh.tone} title={fresh.detail}>
              <span className="status-dot" style={{ background: fresh.tone === 'good' ? 'var(--good)' : fresh.tone === 'warn' ? 'var(--warn)' : 'var(--bad)' }} />
              {fresh.label}
            </span>

            <button className="icon-button" aria-label="Toggle theme" onClick={onToggleTheme}>
              <Icon name={theme === 'dark' ? 'sun' : 'moon'} />
            </button>

            <button className="icon-button" aria-label={'Alerts: ' + critical + ' critical, ' + warning + ' warning'} style={{ position: 'relative' }} onClick={() => go('/alerts')}>
              <Icon name="bell" />
              {critical ? <span className="nav-badge" style={{ position: 'absolute', top: -2, right: -4 }}>{critical}</span> : null}
            </button>

            <div className="profile">
              <span className="avatar">O</span>
              <span className="profile-text"><strong>operator</strong><small>NOC Operator</small></span>
            </div>
            <button className="icon-button" aria-label="Sign out" onClick={onLogout}><Icon name="logout" /></button>
          </div>
        </header>

        <main className="workspace">
          <nav className="breadcrumbs">
            {(breadcrumbs || []).map((crumb, i) => {
              const label = typeof crumb === 'string' ? crumb : crumb.label;
              const to = typeof crumb === 'string' ? null : crumb.to;
              const last = i === breadcrumbs.length - 1;
              return (
                <React.Fragment key={label + i}>
                  {i ? <span>/</span> : null}
                  {last
                    ? <span>{label}</span>
                    : <a href="#" onClick={(e) => { e.preventDefault(); if (to) go(to); }}>{label}</a>}
                </React.Fragment>
              );
            })}
          </nav>
          <div className="page-heading">
            <div>
              <h1>{title}</h1>
              <p>{subtitle}</p>
            </div>
            {/* Screens portal their create/primary action here, so an "Add …"
                button sits with the page title rather than inside a table panel. */}
            <div className="page-actions" id="page-actions" />
          </div>
          {children}
        </main>

        <footer className="statusbar">
          <span><span className={'status-dot ' + (fresh.tone === 'good' ? 'good' : fresh.tone === 'warn' ? 'warn' : 'bad')} />{fresh.label} · {fresh.detail}</span>
          <span>Gateway time EAT (UTC+3)</span>
          <span className="mono">kamex 1.8.3 · build 7b4dea0</span>
        </footer>
      </div>

      {palette ? (
        <div className="dialog-backdrop" onClick={() => setPalette(false)}>
          <div className="command-dialog" onClick={(e) => e.stopPropagation()}>
            <header><h2>Search</h2><kbd>Esc</kbd></header>
            <input autoFocus placeholder="Carrier, SMSC, session, message ID or MSISDN" value={query} onChange={(e) => setQuery(e.target.value)} style={{ marginTop: 12 }} />
            <div className="search-results">
              {hits.length ? hits.slice(0, 8).map((item) => (
                <a key={item.to} href="#" onClick={(e) => { e.preventDefault(); go(item.to); }}>
                  {item.label}<span>{item.group}</span>
                </a>
              )) : <p className="empty-cell">No screen matches “{query}”. Message IDs and MSISDNs resolve on Message Trace.</p>}
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

/* A screen's primary create action belongs beside the page title, not fused with
   the register it adds to. Screens render it through this portal. */
function PageAction({ children }) {
  const [host, setHost] = React.useState(null);
  React.useEffect(() => { setHost(document.getElementById('page-actions')); }, []);
  return host ? ReactDOM.createPortal(children, host) : null;
}

}

/* Section 13 and UC-ALT-01: severity, duration, affected objects, impact and
   correlated evidence in one view; acknowledge with a note; recovery is detected
   automatically; repeated events group under one incident. */
const ALERT_CATEGORIES = ['any', 'Availability', 'Connectivity quality', 'Capacity', 'Delivery quality', 'Traffic anomaly', 'Infrastructure', 'Telemetry'];

const severityTone = (s) => (s === 'critical' ? 'bad' : s === 'warning' ? 'warn' : 'info');

function AlertsScreen({ onNavigate }) {
  const [category, setCategory] = React.useState('any');
  const [state, setState] = React.useState('active');
  const [selected, setSelected] = React.useState(null);
  const [acked, setAcked] = React.useState({});
  const [ackFor, setAckFor] = React.useState(null);
  const [note, setNote] = React.useState('');

  const rows = ALERTS.filter((a) =>
    (category === 'any' || a.category === category) &&
    (state === 'any' || (state === 'active' ? a.state !== 'recovered' : a.state === state))
  );

  const ack = () => {
    setAcked({ ...acked, [ackFor.id]: 'operator ' + new Date().toLocaleTimeString() + (note ? ' — ' + note : '') });
    setAckFor(null);
    setNote('');
  };

  const evidence = (alert) => EVENTS
    .filter((e) => e.object === alert.object || e.correlation === 'c-8f14e45f')
    .slice(0, 4)
    .map((e) => ({ at: e.at.slice(11), label: e.type, detail: e.detail, state: e.severity === 'critical' ? 'error' : e.severity === 'warning' ? 'warn' : 'info' }));

  return (
    <>
      <Panel
        title="Alerts"
        subtitle="Grouped into incidents — a repeating condition raises its occurrence count rather than a new row"
        action={
          <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <FilterSelect label="Category" value={category} onChange={(e) => setCategory(e.target.value)}>
              {ALERT_CATEGORIES.map((c) => <option key={c}>{c}</option>)}
            </FilterSelect>
            <FilterSelect label="State" value={state} onChange={(e) => setState(e.target.value)}>
              {['active', 'acknowledged', 'recovered', 'any'].map((s) => <option key={s}>{s}</option>)}
            </FilterSelect>
          </span>
        }
      >
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Severity</th><th>Condition</th><th>Category</th><th>Object</th>
                <th>Started</th><th style={{ textAlign: 'right' }}>Duration</th>
                <th style={{ textAlign: 'right' }}>Occurrences</th><th>Acknowledgement</th>
              </tr>
            </thead>
            <tbody>
              {rows.length ? rows.map((a) => (
                <tr key={a.id} className="selectable" onClick={() => setSelected(a)}>
                  <td><StatusBadge tone={severityTone(a.severity)}>{a.severity}</StatusBadge></td>
                  <td><strong style={{ color: 'var(--text-strong)' }}>{a.summary}</strong><span className="row-id">{a.impact}</span></td>
                  <td>{a.category}</td>
                  <td className="mono">{a.object}</td>
                  <td className="mono">{a.started}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{a.duration}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{a.occurrences}</td>
                  <td style={{ color: 'var(--muted)', fontSize: 13 }}>{acked[a.id] || a.ack || 'unacknowledged'}</td>
                </tr>
              )) : <tr><td className="empty-cell" colSpan={8}>No alerts match this filter. That is a real result, not a loading state.</td></tr>}
            </tbody>
          </table>
        </div>
      </Panel>

      <Dialog
        open={Boolean(selected)}
        title={selected ? selected.id + ' — ' + selected.severity : ''}
        onClose={() => setSelected(null)}
        footer={selected ? (
          <>
            <button className="secondary-button" onClick={() => { onNavigate(selected.object.startsWith('q-') ? '/queues' : selected.object.startsWith('TRX') || selected.object.startsWith('TX') ? '/sessions' : '/smscs'); setSelected(null); }}>
              Open affected object
            </button>
            <button className="secondary-button" onClick={() => { onNavigate('/events'); setSelected(null); }}>Correlated events</button>
            {acked[selected.id] || selected.ack ? null : (
              <button className="primary-button" onClick={() => { setAckFor(selected); setSelected(null); }}>Acknowledge</button>
            )}
          </>
        ) : null}
      >
        {selected ? (
          <div style={{ display: 'grid', gap: 16 }}>
            <p style={{ margin: 0, color: 'var(--text-strong)', fontSize: 14 }}>{selected.summary}</p>
            <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(130px, auto) minmax(0, 1fr)', gap: '6px 16px', margin: 0 }}>
              {[['Category', selected.category], ['Affected object', selected.object], ['Started', selected.started], ['Active for', selected.duration], ['Traffic impact', selected.impact], ['Occurrences', String(selected.occurrences)], ['State', selected.state], ['Acknowledgement', acked[selected.id] || selected.ack || 'unacknowledged']].map(([label, value]) => (
                <React.Fragment key={label}>
                  <dt style={{ color: 'var(--muted)', fontSize: 13 }}>{label}</dt>
                  <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
                </React.Fragment>
              ))}
            </dl>
            <div>
              <div className="t-caps" style={{ marginBottom: 8 }}>Correlated evidence</div>
              <Timeline dense items={evidence(selected)} />
            </div>
            <p style={{ margin: 0, color: 'var(--muted)', fontSize: 13 }}>
              The alert clears itself when the recovery condition is met. If the condition recurs it reopens
              on this incident and keeps this history.
            </p>
          </div>
        ) : null}
      </Dialog>

      <Dialog
        open={Boolean(ackFor)}
        title={ackFor ? 'Acknowledge ' + ackFor.id : ''}
        onClose={() => setAckFor(null)}
        footer={<button className="primary-button" onClick={ack}>Acknowledge</button>}
      >
        {ackFor ? (
          <div style={{ display: 'grid', gap: 12 }}>
            <p style={{ margin: 0, color: 'var(--text-strong)' }}>{ackFor.summary}</p>
            <label className="field" style={{ margin: 0 }}>
              <span>Note (optional, recorded on the incident timeline)</span>
              <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="e.g. Carrier NOC engaged, ref INC-4471" />
            </label>
            <p style={{ margin: 0, color: 'var(--muted)', fontSize: 13.5 }}>
              Acknowledging records who is working the incident. It does not resolve it or silence recovery
              detection.
            </p>
          </div>
        ) : null}
      </Dialog>
    </>
  );
}

/* Section 4.1: the carrier register. This list is expected to grow — a gateway
   can hold dozens of networks across several markets — so it stays a pure list
   with server-side style filtering and paging, and each row opens its own page
   rather than expanding detail underneath. */
const HEALTH_ORDER = { critical: 0, degraded: 1, unknown: 2, healthy: 3 };

function CarriersScreen({ onNavigate }) {
  const [query, setQuery] = React.useState('');
  const [health, setHealth] = React.useState('any');
  const [sort, setSort] = React.useState('health');

  const filtered = CARRIERS
    .filter((c) =>
      (health === 'any' || c.health === health) &&
      (!query.trim() ||
        (c.name + ' ' + c.prefixes + ' ' + c.mcc + c.mnc).toLowerCase().includes(query.trim().toLowerCase()))
    )
    .sort((a, b) =>
      sort === 'health' ? HEALTH_ORDER[a.health] - HEALTH_ORDER[b.health]
      : sort === 'queue' ? (b.queue ?? -1) - (a.queue ?? -1)
      : sort === 'traffic' ? (b.tps ?? -1) - (a.tps ?? -1)
      : a.name.localeCompare(b.name)
    );

  const unhealthy = CARRIERS.filter((c) => c.health !== 'healthy').length;

  return (
    <Panel
      title="Carriers"
      subtitle={unhealthy + ' of ' + CARRIERS.length + ' networks need attention. Select one to open its operational page.'}
      action={
        <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <FilterSelect label="Health" value={health} onChange={(e) => setHealth(e.target.value)}>
            {['any', 'critical', 'degraded', 'unknown', 'healthy'].map((h) => <option key={h}>{h}</option>)}
          </FilterSelect>
          <FilterSelect label="Sort" value={sort} onChange={(e) => setSort(e.target.value)}>
            {['health', 'queue', 'traffic', 'name'].map((s) => <option key={s}>{s}</option>)}
          </FilterSelect>
          <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }}>Export CSV</button>
        </span>
      }
    >
      <div className="grid-toolbar" style={{ marginTop: 14 }}>
        <label className="filter-search" style={{ flex: '1 1 260px' }}>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search carrier, prefix or network code" />
        </label>
      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Carrier</th><th>Market</th><th>Health</th><th>SMSCs</th><th>Sessions</th>
              <th style={{ textAlign: 'right' }}>MT TPS</th><th style={{ textAlign: 'right' }}>Utilisation</th>
              <th style={{ textAlign: 'right' }}>Queue</th><th style={{ textAlign: 'right' }}>Delivery</th>
              <th style={{ textAlign: 'right' }}>P95 DLR</th><th>Last connectivity event</th><th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length ? filtered.map((c) => (
              <tr key={c.id} className="selectable" onClick={() => onNavigate('/carriers/' + c.id)}>
                <td><strong style={{ color: 'var(--text-strong)' }}>{c.name}</strong><span className="row-id">{c.prefixes}</span></td>
                <td className="mono" style={{ fontSize: 12.5 }}>UG · {c.mcc}-{c.mnc}</td>
                <td><StatusBadge tone={healthTone(c.health)}>{c.health}</StatusBadge></td>
                <td className="figures">{c.smscs}</td>
                <td className="figures">{c.sessionsUp} / {c.sessionsTotal}</td>
                <td className="figures" style={{ textAlign: 'right' }}>{c.tps === null ? 'unknown' : c.tps}</td>
                <td className="figures" style={{ textAlign: 'right' }}>{c.tps === null ? '—' : Math.round((c.tps / c.capacity) * 100) + '%'}</td>
                <td className="figures" style={{ textAlign: 'right', color: c.queue ? 'var(--warn)' : undefined }}>{c.queue === null ? 'unknown' : c.queue.toLocaleString()}</td>
                <td className="figures" style={{ textAlign: 'right' }}>{c.delivery === null ? 'unknown' : c.delivery + '%'}</td>
                <td className="mono" style={{ textAlign: 'right' }}>{c.p95}</td>
                <td className="mono" style={{ fontSize: 12.5 }}>{c.lastEvent}</td>
                <td className="row-actions">
                  <button className="secondary-button" style={{ padding: '6px 10px', fontSize: 13 }} onClick={(e) => { e.stopPropagation(); onNavigate('/carriers/' + c.id); }}>
                    Open
                  </button>
                </td>
              </tr>
            )) : <tr><td className="empty-cell" colSpan={12}>No carrier matches this filter.</td></tr>}
          </tbody>
        </table>
      </div>

        <span>Showing {filtered.length} of {CARRIERS.length} carriers</span>

        </span>

/* UC-CON-01 as its own route. The incident context — carrier, health, window —
   is the page itself, so drilling into an SMSC or an event never loses it, and
   the carrier register stays a plain list however long it grows. */
const WHAT_CHANGED = {
  'mtn-ug': [
    'Throttling spike: ESME_RTHROTTLED from 0 to 4.1/s at 01:38',
    'Queue growth: +24 msg/s, depth passed 1,000 at 01:40',
    'Delivery drop: 98.1% to 96.2% over 20 minutes',
    'Sessions: 3 of 4 healthy, TRX-02 flapping',
  ],
  'utl-ug': [
    'Session loss: both sessions unbound at 01:19:58 after 6 missed enquire_link responses',
    'Egress stopped: 0 msg/s with 412 messages queued',
    'Delivery: unknown — no submissions accepted since the drop',
  ],
  'smart-ug': [
    'Delivery drop: below 95% since 00:58',
    'Throttling: 0.8% of submissions refused',
    'Manual route override in force since 00:58:40',
  ],
  'smile-ug': [
    'Telemetry stale since 00:12:31 — health is unknown, not healthy',
    'Target suspended by operator, so no traffic is expected',
  ],
};

function CarrierDetailScreen({ carrierId, onNavigate, range }) {
  const carrier = CARRIERS.find((c) => c.id === carrierId);

  if (!carrier) {
    return (
      <Panel title="Carrier not found" subtitle="This carrier is not in the register">

        </p>
        <button className="primary-button" style={{ marginTop: 14 }} onClick={() => onNavigate('/carriers')}>Back to Carriers</button>
      </Panel>
    );
  }

  const smscs = SMSCS.filter((s) => s.carrierId === carrierId);
  const events = EVENTS.filter((e) => smscs.some((s) => s.id === e.object) || e.object === carrierId);
  const alerts = ALERTS.filter((a) => a.object === carrierId || smscs.some((s) => s.id === a.object));
  const changed = WHAT_CHANGED[carrierId] || ['No material change in the selected window.'];
  const utilisation = carrier.tps === null ? null : Math.round((carrier.tps / carrier.capacity) * 100);

  return (
    <>
      {carrier.health === 'unknown' ? (
        <p className="stale-banner">
          Telemetry for {carrier.name} is stale — last successful scrape {carrier.lastEvent.replace('telemetry stale ', '')}.
          Everything below is the last known value, and its health is reported unknown rather than healthy.
        </p>
      ) : null}

      <section className="metrics-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))' }}>
        <MetricCard label="Health" value={carrier.health} detail={carrier.name + ' · UG ' + carrier.mcc + '-' + carrier.mnc} icon="alert" tone={healthTone(carrier.health) === 'good' ? 'good' : healthTone(carrier.health) === 'warn' ? 'warn' : 'bad'} />
        <MetricCard label="Sessions healthy" value={carrier.sessionsUp + ' / ' + carrier.sessionsTotal} detail={'across ' + carrier.smscs + ' SMSC(s)'} icon="api" tone={carrier.sessionsUp < carrier.sessionsTotal ? 'warn' : 'primary'} />
        <MetricCard label="Utilisation" value={utilisation === null ? 'unknown' : utilisation + '%'} detail={carrier.tps === null ? 'telemetry stale' : carrier.tps + ' of ' + carrier.capacity + ' TPS'} icon="chart" />
        <MetricCard label="Queued" value={carrier.queue === null ? 'unknown' : carrier.queue.toLocaleString()} detail={'oldest ' + carrier.queueAge} icon="queue" tone={carrier.queue ? 'warn' : 'primary'} />
        <MetricCard label="Delivery" value={carrier.delivery === null ? 'unknown' : carrier.delivery + '%'} detail={'P95 ' + carrier.p95} icon="check" tone={carrier.delivery === null ? 'warn' : carrier.delivery < 95 ? 'bad' : 'good'} />
      </section>

      <section className="split-grid wide-left">
        <Panel
          title="Traffic and quality"
          subtitle={'Synchronised over the last ' + range + ', so a drop reads against the incident time'}
          action={<button className="text-button" onClick={() => onNavigate('/traffic')}>Open Live Traffic</button>}
        >
          <div style={{ marginTop: 16 }}>
            <MiniChart
              series={[{ name: 'MT submitted', values: MT_SERIES }, { name: 'DLR received', values: DLR_SERIES }]}
              labels={CLOCK_LABELS}
              height={160}
            />
          </div>
        </Panel>

        <Panel title="What changed" subtitle="Stated, not inferred">
          <ul style={{ listStyle: 'none', margin: '16px 0 0', padding: 0, display: 'grid', gap: 10 }}>
            {changed.map((line) => (
              <li key={line} style={{ display: 'grid', gridTemplateColumns: '8px minmax(0, 1fr)', gap: 10, fontSize: 13.5, color: 'var(--text)', lineHeight: 1.5 }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--warn)', marginTop: 6 }} />
                <span>{line}</span>
              </li>
            ))}
          </ul>
        </Panel>
      </section>

      <Panel
        title="SMSCs"
        subtitle="Ranked by traffic impact and queue growth"
        action={<button className="text-button" onClick={() => onNavigate('/smscs')}>Open SMSCs</button>}
        style={{ marginTop: 16 }}
      >
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>SMSC</th><th>State</th><th>Sessions</th><th style={{ textAlign: 'right' }}>TPS out</th><th style={{ textAlign: 'right' }}>Capacity</th><th style={{ textAlign: 'right' }}>Queue</th><th style={{ textAlign: 'right' }}>Oldest</th><th style={{ textAlign: 'right' }}>Delivery</th><th>Last event</th></tr>
            </thead>
            <tbody>
              {smscs.map((s) => (
                <tr key={s.id} className="selectable" onClick={() => onNavigate('/smscs')}>
                  <td className="mono">{s.id}</td>
                  <td><StatusBadge tone={healthTone(s.state)}>{s.state}</StatusBadge></td>
                  <td className="figures">{s.sessionsUp} / {s.sessionsTotal}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.tpsOut}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{Math.round((s.tpsOut / s.capacity) * 100)}% of {s.capacity}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.queue.toLocaleString()}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.queueAge}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.delivery === null ? 'unknown' : s.delivery + '%'}</td>
                  <td className="mono" style={{ fontSize: 12.5 }}>{s.lastEvent}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>

      <section className="split-grid" style={{ marginTop: 16 }}>
        <Panel
          title="Recent carrier events"
          subtitle="Structured events for this carrier and its SMSCs"
          action={<button className="text-button" onClick={() => onNavigate('/events')}>All events</button>}
        >
          {events.length ? (
            <div style={{ marginTop: 16 }}>
              <Timeline dense items={events.map((e) => ({ at: e.at.slice(11), label: e.type, detail: e.detail, state: e.severity === 'critical' ? 'error' : e.severity === 'warning' ? 'warn' : 'info' }))} />
            </div>
          ) : <p className="chart-empty">No events recorded for this carrier in the selected window.</p>}
        </Panel>

        <Panel
          title="Open alerts"
          subtitle="Incidents touching this carrier"
          action={<button className="text-button" onClick={() => onNavigate('/alerts')}>All alerts</button>}
        >
          {alerts.length ? (
            <ul className="health-list" style={{ marginTop: 8 }}>
              {alerts.map((a) => (
                <li key={a.id}>
                  <span className={'status-dot ' + (a.severity === 'critical' ? 'bad' : 'warn')} />
                  <span><strong>{a.summary}</strong><small>{a.impact} · active {a.duration}</small></span>
                  <StatusBadge tone={a.severity === 'critical' ? 'bad' : 'warn'}>{a.severity}</StatusBadge>
                </li>
              ))}
            </ul>
          ) : <p className="chart-empty">No open alerts for this carrier.</p>}
        </Panel>
      </section>
    </>
  );
}

/* ---- ui_kits/console/SmscsScreen.jsx ---- */
/* Section 4.2. The register is a plain list — filterable by country/territory,
   carrier and state so it stays navigable as the estate grows past one market.
   Everything about one connection, including its controlled actions, lives on
   its own page at /smscs/<id>. */
const SMSC_STATE_ORDER = { disconnected: 0, degraded: 1, suspended: 2, connected: 3 };

function SmscsScreen({ onNavigate }) {
  const [query, setQuery] = React.useState('');
  const [country, setCountry] = React.useState('any');
  const [carrier, setCarrier] = React.useState('any');
  const [state, setState] = React.useState('any');
  const [adding, setAdding] = React.useState(false);
  const [draft, setDraft] = React.useState({ id: '', carrierId: CARRIERS[0].id, protocol: 'SMPP 3.4', host: '', port: '2775', bind: 'transceiver', systemId: '', capacity: '100', windowSize: '10' });
  const [created, setCreated] = React.useState('');

  const set = (k) => (e) => setDraft({ ...draft, [k]: e.target.value });
  const carrierOf = CARRIERS.find((c) => c.id === draft.carrierId);
  const complete = draft.id.trim() && draft.host.trim() && draft.systemId.trim();

  const create = () => {
    SMSCS.push({
      id: draft.id.trim(), country: carrierOf.country, cc: carrierOf.cc,
      carrier: carrierOf.name, carrierId: carrierOf.id, protocol: draft.protocol,
      state: 'suspended', sessionsUp: 0, sessionsTotal: 0, tpsOut: 0, tpsIn: 0,
      capacity: Number(draft.capacity) || 0, queue: 0, queueAge: '—',
      delivery: null, dlrLatency: '—', lastEvent: 'created by operator', suspended: true,
    });
    setCreated(draft.id.trim() + ' created for ' + carrierOf.name + ' (' + carrierOf.country + '), suspended and unbound. Open it to bind once the carrier has whitelisted this gateway.');
    setAdding(false);
  };

  const countries = ['any', ...new Set(SMSCS.map((s) => s.country))];
  const carriers = ['any', ...new Set(SMSCS.filter((s) => country === 'any' || s.country === country).map((s) => s.carrier))];

  const rows = SMSCS
    .filter((s) =>
      (country === 'any' || s.country === country) &&
      (carrier === 'any' || s.carrier === carrier) &&
      (state === 'any' || s.state === state) &&
      (query === '' || (s.id + ' ' + s.carrier + ' ' + s.country).toLowerCase().includes(query.toLowerCase()))
    )
    .slice()
    .sort((a, b) => SMSC_STATE_ORDER[a.state] - SMSC_STATE_ORDER[b.state] || b.tpsOut - a.tpsOut);

  const byCountry = countries.slice(1).map((c) => {
    const list = SMSCS.filter((s) => s.country === c);
    return {
      country: c,
      cc: list[0].cc,
      total: list.length,
      down: list.filter((s) => s.state !== 'connected').length,
      queue: list.reduce((n, s) => n + s.queue, 0),
    };
  });

  return (
    <>
      <PageAction>
        <button className="primary-button" onClick={() => setAdding(true)}>Add SMSC</button>
      </PageAction>

      {created ? <p className="notice" style={{ marginBottom: 14 }}>{created}</p> : null}

      <section className="grid-toolbar" style={{ marginBottom: 14 }}>
        {byCountry.map((c) => (
          <button
            key={c.country}
            className={'chip' + (country === c.country ? ' chip-active' : '')}
            onClick={() => { setCountry(country === c.country ? 'any' : c.country); setCarrier('any'); }}
          >
            <strong>{c.cc}</strong> {c.country}
            <span style={{ color: c.down ? 'var(--warn)' : 'var(--muted)' }}>
              {c.total} SMSC{c.total === 1 ? '' : 's'}{c.down ? ' · ' + c.down + ' not connected' : ''}
            </span>
          </button>
        ))}
      </section>

      <Panel
        title="SMSCs"
        subtitle="Carrier-facing connections. Operator-suspended and carrier-disconnected are distinct states."
        action={
          <span style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
            <span className="filter-search" style={{ width: 230 }}>
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Search SMSC, carrier or country"
                style={{ padding: '8px 12px' }}
              />
            </span>
            <FilterSelect label="Country" value={country} onChange={(e) => { setCountry(e.target.value); setCarrier('any'); }}>
              {countries.map((c) => <option key={c}>{c}</option>)}
            </FilterSelect>
            <FilterSelect label="Carrier" value={carrier} onChange={(e) => setCarrier(e.target.value)}>
              {carriers.map((c) => <option key={c}>{c}</option>)}
            </FilterSelect>
            <FilterSelect label="State" value={state} onChange={(e) => setState(e.target.value)}>
              {['any', 'connected', 'degraded', 'disconnected', 'suspended'].map((s) => <option key={s}>{s}</option>)}
            </FilterSelect>
          </span>
        }
      >
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>SMSC</th><th>Country</th><th>Carrier</th><th>Protocol</th><th>State</th><th>Sessions</th>
                <th style={{ textAlign: 'right' }}>TPS out</th><th style={{ textAlign: 'right' }}>TPS in</th>
                <th style={{ textAlign: 'right' }}>Capacity</th><th style={{ textAlign: 'right' }}>Queue</th>
                <th style={{ textAlign: 'right' }}>Oldest</th><th style={{ textAlign: 'right' }}>DLR</th><th>Last event</th>
              </tr>
            </thead>
            <tbody>
              {rows.length ? rows.map((s) => (
                <tr key={s.id} className="selectable" onClick={() => onNavigate('/smscs/' + s.id)}>
                  <td className="mono">{s.id}</td>
                  <td>
                    {s.country}
                    <span className="row-id">{s.cc}</span>
                  </td>
                  <td>
                    <button className="text-button" onClick={(e) => { e.stopPropagation(); onNavigate('/carriers/' + s.carrierId); }}>{s.carrier}</button>
                  </td>
                  <td className="mono" style={{ fontSize: 13.5 }}>{s.protocol}</td>
                  <td><StatusBadge tone={healthTone(s.state)}>{s.state}</StatusBadge></td>
                  <td className="figures">{s.sessionsUp} / {s.sessionsTotal}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.tpsOut}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.tpsIn}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{Math.round((s.tpsOut / s.capacity) * 100)}% of {s.capacity}</td>
                  <td className="figures" style={{ textAlign: 'right' }}>{s.queue.toLocaleString()}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.queueAge}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.delivery === null ? 'unknown' : s.delivery + '% / ' + s.dlrLatency}</td>
                  <td className="mono" style={{ fontSize: 13.5 }}>{s.lastEvent}</td>
                </tr>
              )) : <tr><td className="empty-cell" colSpan={13}>No SMSC matches this filter.</td></tr>}
            </tbody>
          </table>
        </div>
        <div className="pager">
          <span>{rows.length} of {SMSCS.length} connections{country === 'any' ? ' across ' + byCountry.length + ' countries' : ' in ' + country}</span>
          <span>Ordered by state, then traffic. Open a connection for its sessions, queue and controls.</span>
        </div>
      </Panel>

      <Dialog
        open={adding}
        title="Add SMSC"
        onClose={() => setAdding(false)}
        footer={
          <>
            <button className="secondary-button" onClick={() => setAdding(false)}>Cancel</button>
            <button className="primary-button" disabled={!complete} onClick={create}>Create suspended</button>
          </>
        }
      >
        <p style={{ color: 'var(--muted)', margin: '0 0 16px' }}>
          A new connection is created suspended and unbound, so nothing is submitted to the carrier
          until an operator binds it. The password is written straight to the engine keystore and is
          never displayed again.
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '0 16px' }}>
          <Field label="SMSC identifier" hint="lowercase, carrier and bind, e.g. mtn_ug_trx3">
            <input value={draft.id} onChange={set('id')} placeholder="mtn_ug_trx3" />
          </Field>
          <Field label="Carrier">
            <select value={draft.carrierId} onChange={set('carrierId')}>
              {CARRIERS.map((c) => <option key={c.id} value={c.id}>{c.name} · {c.country}</option>)}
            </select>
          </Field>
          <Field label="Host">
            <input value={draft.host} onChange={set('host')} placeholder="smpp.carrier.co.ug" />
          </Field>
          <Field label="Port">
            <input value={draft.port} onChange={set('port')} />
          </Field>
          <Field label="Bind type">
            <select value={draft.bind} onChange={set('bind')}>
              {['transceiver', 'transmitter', 'receiver'].map((b) => <option key={b}>{b}</option>)}
            </select>
          </Field>
          <Field label="Protocol">
            <select value={draft.protocol} onChange={set('protocol')}>
              {['SMPP 3.4', 'SMPP 5.0'].map((p) => <option key={p}>{p}</option>)}
            </select>
          </Field>
          <Field label="system_id">
            <input value={draft.systemId} onChange={set('systemId')} placeholder="issued by the carrier" />
          </Field>
          <Field label="Password">
            <input type="password" placeholder="stored in the engine keystore" />
          </Field>
          <Field label="TPS ceiling" hint="the rate the carrier has agreed to accept">
            <input value={draft.capacity} onChange={set('capacity')} />
          </Field>
          <Field label="Window size">
            <input value={draft.windowSize} onChange={set('windowSize')} />
          </Field>
        </div>
        <p style={{ color: 'var(--muted)', fontSize: 13.5, margin: 0 }}>
          Creating this connection is recorded in the audit trail against your account.
          Routing to it must be added separately on Carrier Routes.
        </p>
      </Dialog>
    </>
  );
}

/* ---- ui_kits/console/SmscDetailScreen.jsx ---- */
/* Section 4.2, UC-SMSC-01 and UC-SMSC-02 as their own route at /smscs/<id>. The
   register stays a plain list however many connections the estate grows to, and
   the controlled actions live with the connection they affect. Actions are
   state-aware: reconnect on a failed or degraded connection, suspend on a live
   one, resume on a suspended one — each states its impact and captures a reason. */
function SmscDetailScreen({ smscId, onNavigate }) {
  const smsc = SMSCS.find((s) => s.id === smscId);
  const [action, setAction] = React.useState(null);
  const [result, setResult] = React.useState('');
  const [state, setState] = React.useState(null);

  if (!smsc) {
    return (
      <Panel title="SMSC not found" subtitle="This connection is not in the register">
        <p style={{ marginTop: 14, color: 'var(--muted)' }}>It may have been removed, or the link is stale.</p>
        <button className="primary-button" style={{ marginTop: 14 }} onClick={() => onNavigate('/smscs')}>Back to SMSCs</button>
      </Panel>
    );
  }

  const live = state || smsc.state;
  const sessions = SESSIONS.filter((s) => s.smsc === smsc.id);
  const events = EVENTS.filter((e) => e.object === smsc.id);
  const queue = QUEUES.find((q) => q.destination === smsc.id);
  const routes = ROUTES.filter((r) => r.primary === smsc.id || r.secondary === smsc.id || r.emergency === smsc.id);
  const utilisation = Math.round((smsc.tpsOut / smsc.capacity) * 100);

  const run = () => {
    const verb = action.kind;
    setState(verb === 'suspend' ? 'suspended' : verb === 'resume' ? 'connected' : live);
    setResult(
      verb === 'reconnect'
        ? (smsc.state === 'disconnected'
            ? 'Reconnect on ' + smsc.id + ' failed — connection refused by the carrier. Recorded with your reason; open the correlated events for the socket detail.'
            : 'Reconnect on ' + smsc.id + ' reported bind_cycled — the drop was observed and both sessions came back.')
        : verb === 'suspend'
          ? smsc.id + ' suspended. New submissions stop; existing sessions stay bound and the queue remains visible.'
          : smsc.id + ' resumed. Watching queue drain and error rate.'
    );
    setAction(null);
  };

  const impactFor = (kind) => {
    if (kind === 'reconnect') return [
      ['Current state', live],
      ['Sessions affected', smsc.sessionsUp + ' of ' + smsc.sessionsTotal],
      ['Queued messages', smsc.queue.toLocaleString() + ' (oldest ' + smsc.queueAge + ')'],
      ['Current throughput', smsc.tpsOut + ' msg/s out'],
      ['Expected impact', 'submissions pause while the bind cycles, typically 5-15s'],
    ];
    if (kind === 'suspend') return [
      ['Current state', live],
      ['Scope', 'stops new submissions only; sessions stay bound'],
      ['Queue now', smsc.queue.toLocaleString() + ' messages'],
      ['Ingress continues at', smsc.tpsOut + ' msg/s, so the queue will grow'],
      ['Alerting', 'a queue-growth alert will escalate if depth becomes critical'],
    ];
    return [
      ['Current state', live],
      ['Queue to drain', smsc.queue.toLocaleString() + ' messages'],
      ['Capacity', smsc.capacity + ' TPS ceiling'],
      ['After resuming', 'queue drain and error rate are monitored for 5 minutes'],
    ];
  };

  return (
    <>
      <PageAction>
        {live !== 'suspended' ? (
          <button className="primary-button" onClick={() => setAction({ kind: 'reconnect' })}>Reconnect</button>
        ) : null}
        {live === 'suspended'
          ? <button className="secondary-button" onClick={() => setAction({ kind: 'resume' })}>Resume traffic</button>
          : <button className="secondary-button danger-button" onClick={() => setAction({ kind: 'suspend' })}>Suspend traffic</button>}
      </PageAction>

      {result ? <p className="notice" style={{ marginBottom: 14 }}>{result}</p> : null}

      {live === 'suspended' ? (
        <p className="stale-banner">
          Suspended by an operator — this is not a carrier fault. Traffic stops here until somebody resumes it.
        </p>
      ) : null}

      <section className="metrics-grid" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(170px, 1fr))' }}>
        <MetricCard label="State" value={live} detail={smsc.carrier + ' · ' + smsc.country} icon="alert" tone={healthTone(live) === 'good' ? 'good' : healthTone(live) === 'warn' ? 'warn' : 'bad'} />
        <MetricCard label="Sessions healthy" value={smsc.sessionsUp + ' / ' + smsc.sessionsTotal} detail={smsc.protocol} icon="api" tone={smsc.sessionsUp < smsc.sessionsTotal ? 'warn' : 'primary'} />
        <MetricCard label="Utilisation" value={utilisation + '%'} detail={smsc.tpsOut + ' of ' + smsc.capacity + ' TPS'} icon="chart" tone={utilisation > 80 ? 'warn' : 'primary'} />
        <MetricCard label="Queued" value={smsc.queue.toLocaleString()} detail={'oldest ' + smsc.queueAge} icon="queue" tone={smsc.queue ? 'warn' : 'primary'} />
        <MetricCard label="Delivery" value={smsc.delivery === null ? 'unknown' : smsc.delivery + '%'} detail={smsc.delivery === null ? 'no recent receipts' : 'P95 ' + smsc.dlrLatency} icon="check" tone={smsc.delivery === null ? 'warn' : smsc.delivery < 95 ? 'bad' : 'good'} />
      </section>

      <section className="split-grid wide-right">
        <Panel
          title="Connection"
          subtitle="Credentials are held by the engine and never sent to the browser"
        >
          <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(140px, auto) minmax(0, 1fr)', gap: '8px 16px', margin: '16px 0 0' }}>
            {[
              ['State', live],
              ['Carrier', smsc.carrier],
              ['Country', smsc.country + ' (' + smsc.cc + ')'],
              ['Protocol', smsc.protocol],
              ['Sessions', smsc.sessionsUp + ' healthy of ' + smsc.sessionsTotal],
              ['Throughput', smsc.tpsOut + ' out / ' + smsc.tpsIn + ' in msg/s'],
              ['Capacity', smsc.capacity + ' TPS ceiling · ' + utilisation + '% used'],
              ['Queue', smsc.queue.toLocaleString() + ' waiting, oldest ' + smsc.queueAge],
              ['Delivery', smsc.delivery === null ? 'unknown — no recent receipts' : smsc.delivery + '% at ' + smsc.dlrLatency + ' P95'],
              ['Last event', smsc.lastEvent],
            ].map(([label, value]) => (
              <React.Fragment key={label}>
                <dt style={{ color: 'var(--muted)', fontSize: 13.5 }}>{label}</dt>
                <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
              </React.Fragment>
            ))}
          </dl>
          <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginTop: 16 }}>
            <button className="text-button" onClick={() => onNavigate('/carriers/' + smsc.carrierId)}>Open {smsc.carrier}</button>
            <button className="text-button" onClick={() => onNavigate('/queues')}>Open Queues</button>
          </div>
        </Panel>

        <Panel
          title="Sessions on this SMSC"
          subtitle="Compare siblings to tell a session fault from a carrier-wide one"
          action={<button className="text-button" onClick={() => onNavigate('/sessions')}>Open SMPP Sessions</button>}
        >
          <div className="table-wrap">
            <table>
              <thead><tr><th>Session</th><th>Bind</th><th style={{ textAlign: 'right' }}>Uptime</th><th style={{ textAlign: 'right' }}>Reconnects</th><th style={{ textAlign: 'right' }}>Timeouts</th><th>Top error</th><th>Health</th></tr></thead>
              <tbody>
                {sessions.length ? sessions.map((s) => (
                  <tr key={s.id} className="selectable" onClick={() => onNavigate('/sessions')}>
                    <td className="mono">{s.id}</td>
                    <td>
                      <span style={{ color: 'var(--text-strong)' }}>{BIND_LABELS[s.bind] || s.bind}</span>
                      <span className="row-id">{s.bind}</span>
                    </td>
                    <td className="mono" style={{ textAlign: 'right' }}>{s.uptime}</td>
                    <td className="figures" style={{ textAlign: 'right', color: s.reconnects > 3 ? 'var(--bad)' : undefined }}>{s.reconnects}</td>
                    <td className="figures" style={{ textAlign: 'right' }}>{s.timeouts}</td>
                    <td className="mono" style={{ fontSize: 13.5 }}>{s.topError}</td>
                    <td><StatusBadge tone={healthTone(s.health)}>{s.health}</StatusBadge></td>
                  </tr>
                )) : <tr><td className="empty-cell" colSpan={7}>No sessions configured on this connection.</td></tr>}
              </tbody>
            </table>
          </div>
        </Panel>
      </section>

      <section className="split-grid" style={{ marginTop: 16 }}>
        <Panel
          title="Recent events"
          subtitle="Structured events recorded against this connection"
          action={<button className="text-button" onClick={() => onNavigate('/events')}>All events</button>}
        >
          {events.length ? (
            <div style={{ marginTop: 16 }}>
              <Timeline dense items={events.map((e) => ({ at: e.at.slice(11), label: e.type, detail: e.detail, state: e.severity === 'critical' ? 'error' : e.severity === 'warning' ? 'warn' : 'info' }))} />
            </div>
          ) : <p className="chart-empty">No events for this connection in the selected window.</p>}
        </Panel>

        <Panel
          title="Queue and routing"
          subtitle="What depends on this connection staying up"
          action={<button className="text-button" onClick={() => onNavigate('/routes')}>Open Carrier Routes</button>}
        >
          {queue ? (
            <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(140px, auto) minmax(0, 1fr)', gap: '8px 16px', margin: '16px 0 0' }}>
              {[
                ['Depth', queue.depth.toLocaleString() + ' messages'],
                ['Oldest', queue.oldest],
                ['Ingress / egress', queue.ingress + ' / ' + queue.egress + ' msg/s'],
                ['Growth', (queue.growth > 0 ? '+' : '') + queue.growth + ' msg/s'],
                ['Drain estimate', queue.drainReliable ? queue.drain : 'unavailable — no egress'],
              ].map(([label, value]) => (
                <React.Fragment key={label}>
                  <dt style={{ color: 'var(--muted)', fontSize: 13.5 }}>{label}</dt>
                  <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
                </React.Fragment>
              ))}
            </dl>
          ) : <p style={{ color: 'var(--muted)', marginTop: 16 }}>No queue is currently held for this connection.</p>}

          <div style={{ marginTop: 20 }}>
            <div className="t-caps" style={{ marginBottom: 8 }}>Routes using this connection</div>
            {routes.length ? (
              <ul style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: 8 }}>
                {routes.map((r) => (
                  <li key={r.id} style={{ display: 'flex', justifyContent: 'space-between', gap: 10 }}>
                    <span>{r.name}</span>
                    <span className="mono" style={{ color: 'var(--muted)' }}>
                      {r.primary === smsc.id ? 'primary' : r.secondary === smsc.id ? 'secondary' : 'emergency'}
                      {r.active === smsc.id ? ' · active' : ''}
                    </span>
                  </li>
                ))}
              </ul>
            ) : <p style={{ color: 'var(--muted)', margin: 0 }}>No route targets this connection.</p>}
          </div>
        </Panel>
      </section>

      <ConfirmAction
        open={Boolean(action)}
        title={action ? (action.kind === 'reconnect' ? 'Reconnect ' + smsc.id : action.kind === 'suspend' ? 'Suspend traffic on ' + smsc.id : 'Resume traffic on ' + smsc.id) : ''}
        verb={action ? (action.kind === 'reconnect' ? 'Reconnect' : action.kind === 'suspend' ? 'Suspend' : 'Resume') : ''}
        danger={action ? action.kind === 'suspend' : false}
        warning={action && action.kind === 'suspend' ? 'Traffic keeps arriving while this connection is suspended, so its queue will grow. Suspension is recorded as an operator decision, not a carrier fault.' : null}
        impact={action ? impactFor(action.kind) : []}
        onClose={() => setAction(null)}
        onConfirm={run}
      />
    </>
  );
}

/* Section 5 and UC-SMPP-01. The register is the whole screen; opening a session
   slides its detail in from the right at half the viewport so the operator keeps
   their place in the table. Bind state is mapped to human-readable status, the
   endpoint never shows credentials, and a flapping session is diagnosed from a
   bind timeline rather than by inferring sequence from separate tables. */
const BIND_HISTORY = {
  'TRX-02': [
    { at: '01:11:40', label: 'bind failed', detail: 'ESME_RALYBND — previous bind not yet released', state: 'error' },
    { at: '01:12:04', label: 'enquire_link timeout', detail: 'no response within 5s, 1 missed', state: 'warn' },
    { at: '01:12:18', label: 'socket closed', detail: 'remote peer reset the connection', state: 'error' },
    { at: '01:12:40', label: 'bound', detail: 'BOUND_TRX re-established, RTT 388 ms', state: 'ok' },
    { at: '01:33:02', label: 'bind failed', detail: 'ESME_RALYBND on retry 6', state: 'error' },
    { at: '01:37:02', label: 'bound', detail: 'BOUND_TRX re-established', state: 'ok' },
    { at: '01:41:11', label: 'throttled', detail: 'ESME_RTHROTTLED at 4.1/s while bound', state: 'warn' },
  ],
  'TRX-06': [
    { at: '01:18:44', label: 'enquire_link timeout', detail: 'first missed response', state: 'warn' },
    { at: '01:19:31', label: 'enquire_link timeout', detail: '6 consecutive missed responses', state: 'error' },
    { at: '01:19:58', label: 'unbound', detail: 'session dropped by the gateway after missed keepalives', state: 'error' },
    { at: '01:20:44', label: 'bind failed', detail: 'connection refused (errno 111) — carrier not accepting', state: 'error' },
    { at: '—', label: 'bound', detail: 'never re-established', state: 'missing' },
  ],
};

function DetailList({ rows }) {
  return (
    <dl style={{ display: 'grid', gridTemplateColumns: 'minmax(140px, auto) minmax(0, 1fr)', gap: '8px 16px', margin: 0 }}>
      {rows.map(([label, value]) => (
        <React.Fragment key={label}>
          <dt style={{ color: 'var(--muted)', fontSize: 13.5 }}>{label}</dt>
          <dd className="mono" style={{ margin: 0, color: 'var(--text-strong)' }}>{value}</dd>
        </React.Fragment>
      ))}
    </dl>
  );
}

function SectionHead({ title, note }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div className="t-caps">{title}</div>
      {note ? <p style={{ margin: '4px 0 0', color: 'var(--muted)', fontSize: 13.5 }}>{note}</p> : null}
    </div>
  );
}

            <tbody>

                  <td className="figures" style={{ textAlign: 'right' }}>{s.timeouts}</td>
                  <td className="mono" style={{ textAlign: 'right' }}>{s.latencyP95}</td>
                  <td className="mono" style={{ fontSize: 12.5 }}>{s.topError}</td>
                  <td><StatusBadge tone={healthTone(s.health)}>{s.health}</StatusBadge></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>

      <Drawer
        open={!!session}
        eyebrow={session ? session.smsc : ''}
        title={session ? session.id : ''}
        subtitle={session ? BIND_LABELS[session.bind] + ' · ' + session.carrier : ''}
        onClose={close}
        actions={
          session ? (
            <>
              <button className="secondary-button" onClick={() => setCompare(true)}>Compare sessions</button>
              <button className="secondary-button" onClick={() => setSummary(true)}>Diagnostic summary</button>
            </>
          ) : null
        }
      >
        {session ? (
          <>
            <div>
              <SectionHead title="Session" />
              <DetailList rows={[
                ['Bind state', BIND_LABELS[session.bind] + ' (' + session.bind + ')'],
                ['Endpoint', session.endpoint],
                ['Uptime', session.uptime],
                ['Last activity', session.lastActivity],
                ['Enquire link', session.enquireRtt + ' RTT · ' + session.enquireMissed + ' missed'],
                ['submit_sm', session.submit.toLocaleString() + ' / ' + session.submitResp.toLocaleString() + ' resp'],
                ['deliver_sm', session.deliver.toLocaleString() + ' / ' + session.deliverResp.toLocaleString() + ' resp'],
                ['generic_nack', String(session.nack)],
                ['Response latency P95', session.latencyP95],
                ['Reconnects (' + range + ')', String(session.reconnects)],
                ['Timeouts', String(session.timeouts)],
              ]} />
            </div>

            {errors.length ? (
              <div>
                <SectionHead title="Top command statuses" />
                <ul style={{ listStyle: 'none', margin: 0, padding: 0, display: 'grid', gap: 8 }}>
                  {errors.map((e) => (
                    <li key={e.code} style={{ display: 'flex', justifyContent: 'space-between', gap: 10, fontSize: 13.5 }}>
                      <span className="mono">{e.name}</span>
                      <span className="figures" style={{ color: 'var(--muted)' }}>{e.count.toLocaleString()} · {e.rate}</span>
                    </li>
                  ))}
                </ul>
                <button className="text-button" style={{ marginTop: 10 }} onClick={() => onNavigate('/smpp-errors')}>Open SMPP Errors</button>
              </div>

            <div>
              <SectionHead

                  <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 14 }}>
                    {session.reconnects > 3
                      ? 'This session reconnected ' + session.reconnects + ' times while its siblings on the same SMSC stayed bound, which points at the session rather than the carrier.'

      {session ? (
        <>
          <Dialog open={compare} title={'Sessions on ' + session.smsc} onClose={() => setCompare(false)}>
            <div className="table-wrap" style={{ margin: 0 }}>
              <table>
                <thead><tr><th>Session</th><th>Bind</th><th style={{ textAlign: 'right' }}>Uptime</th><th style={{ textAlign: 'right' }}>Reconnects</th><th style={{ textAlign: 'right' }}>Timeouts</th><th style={{ textAlign: 'right' }}>Missed</th><th>Health</th></tr></thead>
                <tbody>
                  {siblings.map((s) => (
                    <tr key={s.id} style={s.id === session.id ? { background: 'var(--brand-soft)' } : undefined}>
                      <td className="mono">{s.id}</td>
                      <td className="mono" style={{ fontSize: 12.5 }}>{s.bind}</td>
                      <td className="mono" style={{ textAlign: 'right' }}>{s.uptime}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{s.reconnects}</td>
                      <td className="figures" style={{ textAlign: 'right' }}>{s.timeouts}</td>

                </tbody>
              </table>
            </div>
            <p style={{ color: 'var(--muted)', fontSize: 13.5, marginTop: 14 }}>
