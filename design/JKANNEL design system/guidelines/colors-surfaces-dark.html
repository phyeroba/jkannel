<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — dark" subtitle="data-theme="dark"; the sidebar stays navy in both themes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#25293c;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">bg</div><div class="mono" style="font-size:11px;color:var(--muted)">#25293c</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#2f3349;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">surface</div><div class="mono" style="font-size:11px;color:var(--muted)">#2f3349</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#343a55;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">surface-2</div><div class="mono" style="font-size:11px;color:var(--muted)">#343a55</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#3b4056;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">border</div><div class="mono" style="font-size:11px;color:var(--muted)">#3b4056</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#2b2c40;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">sidebar</div><div class="mono" style="font-size:11px;color:var(--muted)">#2b2c40</div></div></div>
</body>
</html>
