<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Light cards carry shadow, not border; overlays use shadow-lg" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
  <div style="display:grid;gap:6px"><div style="height:62px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow)"></div><span class="mono" style="font-size:11px;color:var(--muted)">--shadow · cards</span></div>
  <div style="display:grid;gap:6px"><div style="height:62px;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-lg)"></div><span class="mono" style="font-size:11px;color:var(--muted)">--shadow-lg · menus</span></div>
  <div style="display:grid;gap:6px"><div style="height:62px;background:var(--brand);border-radius:8px;box-shadow:var(--shadow-brand)"></div><span class="mono" style="font-size:11px;color:var(--muted)">--shadow-brand · primary</span></div>
</div>
</body>
</html>
