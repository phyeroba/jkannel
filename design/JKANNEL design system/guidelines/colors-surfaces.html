<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#f8f7fa;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">bg</div><div class="mono" style="font-size:11px;color:var(--muted)">#f8f7fa</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#ffffff;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">surface</div><div class="mono" style="font-size:11px;color:var(--muted)">#ffffff</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#fbfbfc;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">surface-2</div><div class="mono" style="font-size:11px;color:var(--muted)">#fbfbfc</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#ebe9f1;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">border</div><div class="mono" style="font-size:11px;color:var(--muted)">#ebe9f1</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#dbdade;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">input-border</div><div class="mono" style="font-size:11px;color:var(--muted)">#dbdade</div></div></div>
</body>
</html>
