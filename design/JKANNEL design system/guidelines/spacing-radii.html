<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:flex;gap:14px;align-items:flex-end">
  <div style="display:grid;gap:6px;justify-items:center"><div style="width:82px;height:62px;background:var(--surface);box-shadow:var(--shadow);border-radius:6px"></div><span class="mono" style="font-size:11px;color:var(--muted)">6px r-xs</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:82px;height:62px;background:var(--surface);box-shadow:var(--shadow);border-radius:8px"></div><span class="mono" style="font-size:11px;color:var(--muted)">8px r-md</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:82px;height:62px;background:var(--surface);box-shadow:var(--shadow);border-radius:10px"></div><span class="mono" style="font-size:11px;color:var(--muted)">10px r-lg</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:82px;height:62px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px"></div><span class="mono" style="font-size:11px;color:var(--muted)">14px r-xl</span></div>
  <div style="display:grid;gap:6px;justify-items:center"><div style="width:82px;height:32px;background:var(--brand-soft);border-radius:999px"></div><span class="mono" style="font-size:11px;color:var(--muted)">pill</span></div>
</div>
</body>
</html>
