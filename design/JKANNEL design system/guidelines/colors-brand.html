<!-- @dsCard group="Colors" viewport="700x150" name="Accent — DocFlow Blue" subtitle="The single accent ramp, shared with the DocFlow design system" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-ui);background:var(--surface)}
.row{display:flex;padding:20px;gap:0}
.sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;box-sizing:border-box}
.sw span{font-family:var(--font-mono);font-size:11px;line-height:1.4}
.hex{font-weight:500}</style></head>
<body><div class="row">
<div class="sw" style="background:var(--blue-50)"><span style="color:var(--blue-900)">50</span><span class="hex" style="color:var(--blue-900)">#eef7fc</span></div>
<div class="sw" style="background:var(--blue-100)"><span style="color:var(--blue-900)">100</span><span class="hex" style="color:var(--blue-900)">#d5ebf7</span></div>
<div class="sw" style="background:var(--blue-200)"><span style="color:var(--blue-900)">200</span><span class="hex" style="color:var(--blue-900)">#aed8ef</span></div>
<div class="sw" style="background:var(--blue-300)"><span style="color:var(--blue-900)">300</span><span class="hex" style="color:var(--blue-900)">#78bde4</span></div>
<div class="sw" style="background:var(--blue-400)"><span style="color:#fff">400</span><span class="hex" style="color:#fff">#3fa1d6</span></div>
<div class="sw" style="background:var(--blue-500);outline:2px solid var(--blue-700);outline-offset:-2px"><span style="color:#fff">500 ★</span><span class="hex" style="color:#fff">#1a86c8</span></div>
<div class="sw" style="background:var(--blue-600)"><span style="color:#fff">600</span><span class="hex" style="color:#fff">#146ba3</span></div>
<div class="sw" style="background:var(--blue-700)"><span style="color:#fff">700</span><span class="hex" style="color:#fff">#12567f</span></div>
<div class="sw" style="background:var(--blue-800)"><span style="color:#fff">800</span><span class="hex" style="color:#fff">#124a6b</span></div>
<div class="sw" style="background:var(--blue-900)"><span style="color:#fff">900</span><span class="hex" style="color:#fff">#123c56</span></div>
</div></body></html>
