<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:grid;gap:10px">
  <div style="color:var(--text-strong);font-size:20px;font-weight:700;letter-spacing:-.02em">text-strong #444050 — headings, figures, table cells</div>
  <div style="color:var(--text);font-size:14px">text #6f6b7d — body copy, the :root color of the console</div>
  <div style="color:var(--muted);font-size:12.5px">muted #a5a2ad — captions, table headers, detail lines</div>
  <div style="color:var(--ink-faint);font-size:12.5px">ink-faint #b9b7c0 — disabled and placeholder</div>
</div>
</body>
</html>
