<!-- @dsCard group="Colors" viewport="700x150" name="Accent in use" subtitle="500 for action, 600 hover, 700 press, soft tint for chips and active fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="../assets/icons.js" defer></script>
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui)}</style></head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
  <button class="primary-button">Refresh dashboard</button>
  <button class="primary-button" style="background:var(--brand-2);border-color:var(--brand-2)">Hover — 600</button>
  <button class="primary-button" style="background:var(--brand-press);border-color:var(--brand-press)">Press — 700</button>
  <span class="metric-icon"><i data-ico="queue" data-size="20"></i></span>
  <span style="display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:5px 11px;border-radius:8px">Admin Console</span>
  <a href="#">Text link</a>
  <span style="background:var(--sidebar);padding:8px;border-radius:8px;display:inline-flex"><a class="active" href="#" style="display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:center;padding:8px 11px;border-radius:7px;background:var(--brand);color:#fff;font-size:13px;box-shadow:var(--shadow-brand)"><i data-ico="home"></i><span>Active nav</span></a></span>
</div>
</body></html>
