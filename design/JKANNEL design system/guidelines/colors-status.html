<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="good · warn · bad · info — identical hexes in light and dark" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="../assets/icons.js" defer></script>
<style>body{padding:16px;background:var(--bg);}</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#28c76f;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">good</div><div class="mono" style="font-size:11px;color:var(--muted)">#28c76f</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#ff9f43;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">warn</div><div class="mono" style="font-size:11px;color:var(--muted)">#ff9f43</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#ea5455;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">bad</div><div class="mono" style="font-size:11px;color:var(--muted)">#ea5455</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#00cfe8;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">info</div><div class="mono" style="font-size:11px;color:var(--muted)">#00cfe8</div></div><div style="display:grid;gap:6px"><div style="height:56px;border-radius:8px;background:#a5a2ad;box-shadow:var(--shadow)"></div><div style="font-size:11.5px;color:var(--text-strong);font-weight:600">neutral</div><div class="mono" style="font-size:11px;color:var(--muted)">#a5a2ad</div></div></div>
</body>
</html>
