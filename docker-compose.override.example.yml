# TEMPLATE — copy, do not use in place.
#
#   cp docker-compose.override.example.yml deploy/<your-host>/docker-compose.override.yml
#
# `docker-compose.override.yml` is AUTO-LOADED by Compose and is git-ignored, so
# each machine gets its own. Nothing in this file belongs in the repository:
# ports, bind addresses and test fixtures are properties of a HOST, not of the
# product. Two developers on one committed override would fight over ports, and
# a developer who pulled ours would silently inherit our server's topology.
#
# Ship yours with:  ./scripts/deploy-config.ps1 -Host <name>
#
# ============================================================================
# 1. BIND TO LOOPBACK WHEN SOMETHING ELSE FRONTS YOU
# ============================================================================
# Only needed when a system reverse proxy (nginx, Caddy, Traefik) terminates
# TLS in front of the stack — the normal shape for a shared or internet-facing
# host. On a private laptop the base file's defaults are fine and you can drop
# this whole section.
#
# ┌────────────────────────────────────────────────────────────────────────┐
# │ THE `!override` TAG IS NOT OPTIONAL.                                   │
# │                                                                        │
# │ Compose MERGES sequence fields. Without it, the base file's 0.0.0.0    │
# │ bindings survive ALONGSIDE these: the services stay publicly reachable │
# │ — the exact thing you were preventing — and the duplicate bind fails   │
# │ with "address already in use". `!override` replaces the list outright. │
# └────────────────────────────────────────────────────────────────────────┘

services:
  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-3200}:3000"

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"

  reverse-proxy:
    ports: !override
      - "127.0.0.1:${PROXY_HTTP_PORT:-8081}:8080"

  kamex-bearerbox:
    ports: !override
      - "127.0.0.1:${KAMEX_ADMIN_PORT:-13000}:13000"

  kamex-smsbox:
    ports: !override
      - "127.0.0.1:${KAMEX_SENDSMS_PORT:-13013}:13013"

  # ==========================================================================
  # 2. OPTIONAL — A TEST BIND, FOR HOSTS WITH NO REAL CARRIER
  # ==========================================================================
  # Kannel's `smsc = fake` bearer LISTENS for a client. With nothing attached,
  # zero SMSCs are online and the engine correctly reports itself unhealthy.
  # This attaches Kannel's own fakesmsc so one bind is genuinely online and the
  # whole pipeline becomes exercisable before a carrier exists.
  #
  # `-m 0` means it sends NOTHING — it only holds the bind open, generating no
  # traffic and writing no rows.
  #
  # ┌────────────────────────────────────────────────────────────────────────┐
  # │ IT IS NOT A CARRIER. Messages routed to `local-fake` are accepted by   │
  # │ the engine and DISCARDED — never delivered to a handset. A test send   │
  # │ will report success and deliver nothing.                               │
  # │                                                                        │
  # │ DELETE this service, and the matching SMSC, the moment a real carrier  │
  # │ is configured. Leaving it is how "we tested it and it worked" turns    │
  # │ into a silent black hole in production.                                │
  # └────────────────────────────────────────────────────────────────────────┘
  loopback-bind:
    # Same profile as the engine it attaches to, otherwise a plain
    # `docker compose` command sees a dangling depends_on reference.
    profiles: ["engine-kamex"]
    image: ghcr.io/vaska94/kamex:1.8.3@sha256:c13f0e390bf0cbadef55440a6dc584670851faf41e42a027644e984502a21d7d
    entrypoint: ["/usr/bin/fakesmsc"]
    command: ["-H", "kamex-bearerbox", "-r", "10000", "-m", "0", "0 0 text idle"]
    depends_on:
      kamex-bearerbox:
        condition: service_healthy
    networks:
      - appnet
    # fakesmsc serves no HTTP; the image healthcheck could never pass and would
    # leave the container permanently "unhealthy".
    healthcheck:
      disable: true
    mem_limit: 64m
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
