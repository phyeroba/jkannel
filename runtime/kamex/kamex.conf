# Local validation configuration. Production configuration is generated by JKANNEL.
# Carrier SMSCs (SMPP/HTTP/etc.) are added through the console; credentials are
# supplied via environment/secret references, never committed here.
group = core
admin-port = 13000
admin-password = ${KAMEX_ADMIN_PASSWORD}
status-password = ${KAMEX_STATUS_PASSWORD}
smsbox-port = 13001
log-level = 1
log-format = json

group = smsc
smsc = fake
smsc-id = local-fake
port = 10000

group = smsbox
bearerbox-host = kamex-bearerbox
sendsms-port = 13013
log-level = 1
log-format = json

group = sendsms-user
username = jkannel
password = ${KAMEX_SENDSMS_PASSWORD}

group = sms-service
keyword = default
text = "No service specified"
