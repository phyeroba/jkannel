# Generated by JKANNEL. Do not edit by hand.
# Credentials appear only as ${ENV} placeholders resolved by the engine runtime.
group = core
admin-port = 13000
smsbox-port = 13001
admin-password = ${KAMEX_ADMIN_PASSWORD}
status-password = ${KAMEX_STATUS_PASSWORD}
log-level = 1
log-format = json
dlr-storage = pgsql

group = smsc
smsc = smpp
smsc-id = carrier-a
host = smpp.carrier-a.example
port = 2775
smsc-username = jkannel_prod
smsc-password = ${KAMEX_CARRIER_A_PASSWORD}
system-type = VMA
interface-version = 34
transceiver-mode = 1
source-addr-ton = 5
source-addr-npi = 0
dest-addr-ton = 1
dest-addr-npi = 1
max-pending-submits = 20
enquire-link-interval = 30
wait-ack = 60
use-ssl = true
throughput = 50
reconnect-delay = 10
max-error-count = 10

group = smsbox
bearerbox-host = kamex-sqlbox
sendsms-port = 13013
log-level = 1
log-format = json

group = sendsms-user
username = jkannel
password = ${KAMEX_SENDSMS_PASSWORD}
user-allow-ip = *
max-messages = 10
concatenation = true

group = sms-service
keyword = default
text = "No service specified"
max-messages = 0

# SQLBox PostgreSQL connection (consumed by the SQLBox process)
group = pgsql-connection
id = jkannel-sqlbox
host = postgres
port = 5432
database = jkannel
username = ${JKANNEL_SQLBOX_USER}
password = ${JKANNEL_SQLBOX_PASSWORD}

# Delivery report persistence (survives an engine restart)
group = dlr-db
id = jkannel-sqlbox
table = dlr
field-smsc = smsc
field-timestamp = ts
field-destination = destination
field-source = source
field-service = service
field-url = url
field-mask = mask
field-status = status
field-boxc-id = boxc
